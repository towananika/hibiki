<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>首都圏・暮らしの経済価値</title><style>
:root{--bg:#f7f8f6;--ink:#28312b;--muted:#737d76;--gray:#d3d8d4;--line:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
main{height:100dvh;display:flex;flex-direction:column;max-width:700px;margin:auto;padding:12px 13px max(10px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:9px;min-height:35px}header a{font-size:25px;text-decoration:none;color:inherit;line-height:1}h1{font-size:17px;letter-spacing:-.03em;margin:0;flex:1}.sub{font-size:10px;color:var(--muted);white-space:nowrap}
.controls{display:flex;gap:7px;margin:8px 0 8px}select{flex:1;min-width:0;background:white;border:1px solid #e2e7e2;border-radius:10px;font:inherit;font-size:12px;padding:9px 5px;color:var(--ink)}
.map{position:relative;flex:1;min-height:0;background:#eef1ed;border-radius:17px;overflow:hidden;border:1px solid #e5e9e5}
.caption{position:absolute;top:10px;left:12px;font-size:11px;color:#76847b;z-index:1}
.blocks{position:absolute;inset:35px 6px 6px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(17,minmax(0,1fr));gap:2px;overflow:hidden}.region{display:flex;flex-direction:column;min-height:0;flex:1}.region-title{font-size:11px;font-weight:700;color:#66746a;padding:0 2px 3px}.region-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(24px,1fr);gap:3px;flex:1}
.area{min-width:0;border:1px solid #fff9;background:var(--gray);border-radius:6px;color:#39473e;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:clamp(7px,1.9vw,10px);line-height:1.25;padding:2px;cursor:pointer;box-shadow:0 1px 1px #00000008;overflow:hidden}
.area:focus-visible{outline:3px solid #334d40;outline-offset:1px}.area.selected{outline:2px solid #344e40;outline-offset:0}
.area small{display:block;font-size:9px;font-weight:400}
.legend{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:9px 0 3px}.legend span{height:10px;border-radius:3px}
.labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}
.info{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px 2px;min-height:42px}.info strong{font-size:13px}.info span{font-size:11px;color:var(--muted);text-align:right}
details{font-size:11px;color:var(--muted);margin-top:4px}details summary{cursor:pointer}details input{max-width:100%;margin-top:6px;font-size:11px}
@media(min-width:600px){main{padding-top:18px;padding-bottom:18px}.area{font-size:13px}}
</style></head><body><main>
<header><a href="../" aria-label="戻る">‹</a><h1>首都圏の経済価値</h1><span class="sub">模式マップ</span></header>
<div class="controls"><select id="metric" aria-label="評価項目"><option value="net">経済的な余裕</option><option value="housing">住居費</option><option value="commute">通勤負担</option><option value="jobs">仕事へのアクセス</option></select><select id="office" aria-label="通勤先"><option value="central">光化門・市庁へ</option><option value="gangnam">江南へ</option><option value="yeouido">汝矣島へ</option><option value="gasan">加山へ</option></select><select id="mode" aria-label="色の表示"><option value="demo">配色イメージ</option><option value="real">実データのみ</option></select></div>
<div class="map"><div class="caption">首都圏の位置関係を簡略化した模式図・実際の境界ではありません</div><div class="blocks" id="blocks"></div></div>
<div class="legend"><span style="background:#bf5b58"></span><span style="background:#e5a17a"></span><span style="background:#e7d9aa"></span><span style="background:#a7cba8"></span><span style="background:#4e9068"></span><span style="background:#d3d8d4"></span></div>
<div class="labels"><span>余裕が少ない</span><span>余裕が大きい</span><span>灰色：データなし</span></div>
<div class="info"><strong id="name">地域をタップ</strong><span id="detail">色は仮のデザイン例（評価結果ではありません）</span></div>
<details><summary>データを読み込む・地図について</summary><div>JSONファイルを選ぶと色分けできます。形式：{"areas":[{"name":"ソウル 麻浦区","net":210,"housing":-65,"commute":-30,"jobs":70}]}。「実データのみ」では数値がない地域は灰色のまま。数値は利用者のデータのみで、架空の値は使いません。比較基準は暫定値です。</div><input type="file" id="file" accept=".json,application/json"><div id="fileStatus"></div></details>
</main><script>
(function(){
var groups=[{"title":"ソウル特別市","areas":[{"name":"ソウル特別市 鍾路区","label":"鍾路区"},{"name":"ソウル特別市 中区","label":"中区"},{"name":"ソウル特別市 龍山区","label":"龍山区"},{"name":"ソウル特別市 城東区","label":"城東区"},{"name":"ソウル特別市 広津区","label":"広津区"},{"name":"ソウル特別市 東大門区","label":"東大門区"},{"name":"ソウル特別市 中浪区","label":"中浪区"},{"name":"ソウル特別市 城北区","label":"城北区"},{"name":"ソウル特別市 江北区","label":"江北区"},{"name":"ソウル特別市 道峰区","label":"道峰区"},{"name":"ソウル特別市 蘆原区","label":"蘆原区"},{"name":"ソウル特別市 恩平区","label":"恩平区"},{"name":"ソウル特別市 西大門区","label":"西大門区"},{"name":"ソウル特別市 麻浦区","label":"麻浦区"},{"name":"ソウル特別市 陽川区","label":"陽川区"},{"name":"ソウル特別市 江西区","label":"江西区"},{"name":"ソウル特別市 九老区","label":"九老区"},{"name":"ソウル特別市 衿川区","label":"衿川区"},{"name":"ソウル特別市 永登浦区","label":"永登浦区"},{"name":"ソウル特別市 銅雀区","label":"銅雀区"},{"name":"ソウル特別市 冠岳区","label":"冠岳区"},{"name":"ソウル特別市 瑞草区","label":"瑞草区"},{"name":"ソウル特別市 江南区","label":"江南区"},{"name":"ソウル特別市 松坡区","label":"松坡区"},{"name":"ソウル特別市 江東区","label":"江東区"}]},{"title":"京畿道","areas":[{"name":"京畿道 水原市","label":"水原市"},{"name":"京畿道 城南市","label":"城南市"},{"name":"京畿道 高陽市","label":"高陽市"},{"name":"京畿道 龍仁市","label":"龍仁市"},{"name":"京畿道 富川市","label":"富川市"},{"name":"京畿道 安山市","label":"安山市"},{"name":"京畿道 安養市","label":"安養市"},{"name":"京畿道 南楊州市","label":"南楊州市"},{"name":"京畿道 華城市","label":"華城市"},{"name":"京畿道 平沢市","label":"平沢市"},{"name":"京畿道 議政府市","label":"議政府市"},{"name":"京畿道 始興市","label":"始興市"},{"name":"京畿道 坡州市","label":"坡州市"},{"name":"京畿道 光明市","label":"光明市"},{"name":"京畿道 金浦市","label":"金浦市"},{"name":"京畿道 軍浦市","label":"軍浦市"},{"name":"京畿道 広州市","label":"広州市"},{"name":"京畿道 利川市","label":"利川市"},{"name":"京畿道 楊州市","label":"楊州市"},{"name":"京畿道 烏山市","label":"烏山市"},{"name":"京畿道 九里市","label":"九里市"},{"name":"京畿道 安城市","label":"安城市"},{"name":"京畿道 抱川市","label":"抱川市"},{"name":"京畿道 義王市","label":"義王市"},{"name":"京畿道 河南市","label":"河南市"},{"name":"京畿道 驪州市","label":"驪州市"},{"name":"京畿道 東豆川市","label":"東豆川市"},{"name":"京畿道 果川市","label":"果川市"},{"name":"京畿道 加平郡","label":"加平郡"},{"name":"京畿道 楊平郡","label":"楊平郡"},{"name":"京畿道 漣川郡","label":"漣川郡"}]},{"title":"仁川広域市","areas":[{"name":"仁川広域市 中区","label":"中区"},{"name":"仁川広域市 東区","label":"東区"},{"name":"仁川広域市 弥鄒忽区","label":"弥鄒忽区"},{"name":"仁川広域市 延寿区","label":"延寿区"},{"name":"仁川広域市 南洞区","label":"南洞区"},{"name":"仁川広域市 富平区","label":"富平区"},{"name":"仁川広域市 桂陽区","label":"桂陽区"},{"name":"仁川広域市 西区","label":"西区"},{"name":"仁川広域市 江華郡","label":"江華郡"},{"name":"仁川広域市 甕津郡","label":"甕津郡"}]}];
var colors=['#bf5b58','#e5a17a','#e7d9aa','#a7cba8','#4e9068'],data={};
var grid=document.getElementById('blocks'),metric=document.getElementById('metric'),office=document.getElementById('office');
var thresholds={net:[100,150,200,250],housing:[-150,-110,-80,-55],commute:[-90,-65,-45,-25],jobs:[20,40,60,80]};
/* Schematic cartogram: cells approximate metro area shape, not boundaries. */
var positions={
'ソウル特別市':['鍾路区','中区','龍山区','城東区','広津区','東大門区','中浪区','城北区','江北区','道峰区','蘆原区','恩平区','西大門区','麻浦区','陽川区','江西区','九老区','衿川区','永登浦区','銅雀区','冠岳区','瑞草区','江南区','松坡区','江東区'],
'京畿道':['水原市','城南市','高陽市','龍仁市','富川市','安山市','安養市','南楊州市','華城市','平沢市','議政府市','始興市','坡州市','光明市','金浦市','軍浦市','広州市','利川市','楊州市','烏山市','九里市','安城市','抱川市','義王市','河南市','驪州市','東豆川市','果川市','加平郡','楊平郡','漣川郡'],
'仁川広域市':['中区','東区','弥鄒忽区','延寿区','南洞区','富平区','桂陽区','西区','江華郡','甕津郡']
};
/* Each tuple is [column,row], hand-placed for a recognizable rough Seoul metro silhouette. */
var coords={
'ソウル特別市':[[7,7],[7,8],[7,9],[8,8],[9,8],[8,7],[10,7],[8,6],[8,5],[9,4],[10,5],[5,6],[6,7],[5,8],[4,9],[3,8],[4,10],[5,11],[5,9],[6,10],[6,11],[7,11],[8,10],[9,10],[10,9]],
'京畿道':[[6,13],[9,12],[4,5],[9,14],[3,10],[4,14],[6,12],[11,6],[5,16],[6,17],[8,3],[3,13],[3,3],[5,12],[2,6],[5,13],[11,12],[11,15],[6,4],[6,15],[10,8],[8,16],[11,3],[7,13],[10,10],[12,15],[7,2],[8,12],[12,4],[12,9],[6,1]],
'仁川広域市':[[1,9],[2,9],[2,10],[2,11],[3,11],[3,9],[3,7],[2,8],[1,5],[1,13]]
};
var mode=document.getElementById('mode');
function render(){
grid.textContent='';
groups.forEach(function(g){
g.areas.forEach(function(a,i){
var pos=coords[g.title][i],b=document.createElement('button');
b.type='button';b.className='area';b.textContent=a.label.replace(/区$|市$|郡$/,'');
b.title=a.name;b.style.gridColumn=pos[0];b.style.gridRow=pos[1];
var item=data[a.name]||{},key=metric.value==='commute'&&item['commute_'+office.value]!=null?'commute_'+office.value:metric.value;
var v=item[key],ok=typeof v==='number'&&Number.isFinite(v);
if(mode.value==='demo'){b.style.background=colors[(pos[0]*3+pos[1]*2+i)%5];}
else if(ok){var n=thresholds[metric.value].filter(function(t){return v>=t}).length;b.style.background=colors[n];}
b.addEventListener('click',function(){grid.querySelectorAll('.area').forEach(function(x){x.classList.remove('selected')});b.classList.add('selected');document.getElementById('name').textContent=a.name;document.getElementById('detail').textContent=mode.value==='demo'?'色は仮の配色例・地域評価ではありません':(ok?'指標値：'+v:'データなし・未評価');});
grid.appendChild(b);
});
});
document.getElementById('detail').textContent=mode.value==='demo'?'色は仮の配色例・地域評価ではありません':'実データ未接続の地域は灰色';
}
metric.addEventListener('change',render);office.addEventListener('change',render);mode.addEventListener('change',render);
document.getElementById('file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;if(f.size>1000000){document.getElementById('fileStatus').textContent='1MB以下のファイルを選んでください';return;}f.text().then(function(t){var j=JSON.parse(t);if(!Array.isArray(j.areas))throw Error();var next={};j.areas.forEach(function(x){if(x&&typeof x.name==='string')next[x.name]=x;});data=next;render();document.getElementById('fileStatus').textContent='読み込み済み：'+Object.keys(data).length+'地域';}).catch(function(){document.getElementById('fileStatus').textContent='JSONを読み込めませんでした';});});
render();
})();
</script></body></html>
