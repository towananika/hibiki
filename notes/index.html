<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>メモ帳 | 響</title>
<script src="../sync.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f5f1e9;--surface:#fbf9f4;--border:#d7d3c7;--text:#2b2924;--muted:#68665e;--accent:#426c69;--soft:#e2eee9;--blue:#456b91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif;letter-spacing:0}main{max-width:1040px;padding:24px 20px 64px;margin:auto}a{color:var(--blue)}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:25px;margin:14px 0}h2{font-size:16px;margin:0 0 10px}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:5px;background:var(--surface);padding:8px 13px;min-height:42px}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.layout{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:18px}.editor textarea{display:block;width:100%;min-height:310px;resize:vertical;border:1px solid var(--border);border-radius:6px;padding:15px;background:var(--surface)}.small{font-size:12px;color:var(--muted)}#save-status{min-height:24px}.summary{border-left:1px solid var(--border);padding-left:25px}.summary section{margin-bottom:22px}.summary ul{padding-left:20px;margin:0}.summary li{overflow-wrap:anywhere;margin-bottom:6px}#notes{margin-top:36px;border-top:1px solid var(--border);padding-top:22px}.note-row{display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--border);padding:12px 0}.note-title{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;padding-left:0}.note-row input{width:18px;height:18px}dialog{width:min(620px,calc(100% - 28px));max-height:90vh;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:22px}dialog::backdrop{background:#0006}dialog label{display:block;margin:14px 0 6px}dialog textarea{width:100%;border:1px solid var(--border);border-radius:5px;padding:10px;background:var(--bg);resize:vertical}#question{min-height:85px}#prompt{min-height:180px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.empty{color:var(--muted);font-size:14px}input[type=checkbox]{accent-color:var(--accent)}@media(max-width:640px){.layout{grid-template-columns:1fr;gap:24px}.summary{border-left:0;padding-left:0;border-top:1px solid var(--border);padding-top:22px}.editor textarea{min-height:240px}.note-row{grid-template-columns:24px minmax(0,1fr) auto}.note-row time{display:none}header{align-items:flex-start}main{padding:18px 16px 60px}}@media(prefers-color-scheme:dark){:root{--bg:#1c211f;--surface:#262d29;--border:#4c5951;--text:#edf2ee;--muted:#b7c1ba;--accent:#376d63;--blue:#a3c5eb}}
</style>
</head>
<body><main>
<a href="../">響</a>
<header><h1>メモ帳</h1><button id="consult" class="primary" type="button">AIに相談</button></header>
<div class="toolbar"><button id="new" type="button">新しいメモ</button><button id="save" type="button">保存</button><button id="export" type="button">書き出し</button></div>
<div class="layout"><section class="editor" aria-label="メモを書く"><label for="text"><h2>今、考えていること</h2></label><textarea id="text" maxlength="30000" placeholder="思いついたことを、そのまま。"></textarea><p id="save-status" class="small" role="status"></p><p class="small">保存先：このブラウザのみ。メモは暗号化されません。共有端末ではご注意ください。</p></section>
<section class="summary" aria-label="メモの整理"><h2>整理</h2><p class="small">端末内の簡易分類。AIによる要約は未接続です。</p><div id="summary" aria-live="polite"></div></section></div>
<section id="notes"><h2>保存したメモ</h2><p class="small">相談に使うメモを選択</p><div id="note-list"></div></section>
<dialog id="dialog"><div class="dialog-head"><h2>AIに相談</h2><button id="close" type="button" aria-label="閉じる">閉じる</button></div><p class="small">選択したメモと入力中のメモから相談文を作ります。コピー後、ChatGPTに貼り付けて送信してください。自動送信はしません。</p><label for="question">一緒に考えてほしいこと</label><textarea id="question" placeholder="例：私は本当は何がほしいのだろう？"></textarea><label for="prompt">渡す内容</label><textarea id="prompt" readonly></textarea><div class="toolbar"><button id="copy" class="primary" type="button">相談文をコピー</button><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPTを開く</a></div><p id="chat-status" class="small" role="status"></p></dialog>
</main><script type="module" src="app.mjs"></script></body></html>
