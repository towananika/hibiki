<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勉強ノート — とわなにか</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="practice.css">
<script src="../sync.js"></script>
<meta name="theme-color" content="#5b7a99">
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271;
          --wood:#93704b; --sage:#74886d; --blue:#5b7a99; --blue-soft:#e0e7ee; --red:#b5583f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a;
            --wood:#c99f74; --sage:#9db394; --blue:#8fb0cf; --blue-soft:#1f2a35; --red:#e08b70; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); line-height:1.7;
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:520px; margin:0 auto; padding:28px 16px 40px; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  .fz { display:flex; gap:6px; } .fz button { all:unset; cursor:pointer; box-sizing:border-box; min-width:36px; height:30px; padding:0 8px; display:grid; place-items:center; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--sage); font-weight:700; font-size:13px; }
  .top a { color:var(--muted); text-decoration:none; } .top a:first-child { color:var(--sage); font-weight:600; letter-spacing:.1em; }
  h1 { font-size:calc(28px*var(--k,1)); line-height:1.4; margin:16px 0 8px; }
  .toc { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 4px; }
  .toc a { font-size:calc(14px*var(--k,1)); color:var(--blue); background:var(--blue-soft); border-radius:999px; padding:4px 10px; text-decoration:none; }
  .lec { margin-top:14px; } .lec a { color:var(--wood); background:var(--surface); border:1px solid var(--border); } .lec a[aria-current] { background:var(--wood); color:#fff; border-color:var(--wood); font-weight:700; }
  section { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:4px 16px 14px; margin-top:14px; }
  h2 { font-size:calc(22px*var(--k,1)); margin:14px 0 6px; scroll-margin-top:12px; }
  .video-more { margin-top:14px; border-top:1px solid var(--border); padding-top:10px; font-size:calc(15px*var(--k,1)); }
  .video-more summary { cursor:pointer; color:var(--blue); }
  .video-more a { display:inline-block; color:var(--blue); padding:8px 0; overflow-wrap:anywhere; }
  .video-more small { display:block; color:var(--muted); }
  h3 { font-size:calc(18px*var(--k,1)); color:var(--blue); margin:16px 0 4px; }
  p, li, blockquote, th, td, .flow span, .eq span { overflow-wrap:anywhere; }
  pre { max-width:100%; overflow-x:auto; }
  p, li { font-size:calc(18px*var(--k,1)); } ul, ol { padding-left:1.3em; margin:6px 0; } li { margin:3px 0; }
  strong { color:var(--text); background:linear-gradient(transparent 62%, rgba(91,122,153,.22) 0); }
  hr { display:none; }
  blockquote { margin:8px 0; border-left:3px solid var(--sage); padding:2px 0 2px 12px; color:var(--muted); }
  .tw { overflow-x:auto; margin:8px 0; }
  table { border-collapse:collapse; width:100%; font-size:calc(15px*var(--k,1)); }
  th { background:var(--blue-soft); text-align:left; } th, td { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  .bars { display:grid; gap:8px; margin:10px 0; }
  .bar { display:grid; grid-template-columns:calc(110px*var(--k,1)) 1fr calc(60px*var(--k,1)); align-items:center; gap:8px; font-size:calc(15px*var(--k,1)); }
  .bar .tr { height:14px; border-radius:7px; background:var(--bg); overflow:hidden; }
  .bar .tr i { display:block; height:100%; border-radius:7px; }
  .bar b { text-align:right; font-variant-numeric:tabular-nums; }
  .tl { position:relative; margin:10px 0; padding-left:22px; }
  .tl::before { content:""; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:var(--border); }
  .tl div { position:relative; padding:5px 0; font-size:calc(17px*var(--k,1)); line-height:1.5; }
  .tl div::before { content:""; position:absolute; left:-21px; top:10px; width:12px; height:12px; border-radius:50%; background:var(--blue); border:2px solid var(--surface); }
  .tl b { margin-right:6px; font-variant-numeric:tabular-nums; } .tl small { display:block; color:var(--muted); font-size:calc(14px*var(--k,1)); }
  .eq { display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap; font-weight:700; margin:12px 0; }
  .eq span { padding:6px 12px; border-radius:999px; background:var(--bg); }
  .eq span:nth-of-type(1) { background:var(--blue); color:#fff; } .eq span:nth-of-type(2) { background:var(--sage); color:#fff; }
  .eq i { font-style:normal; color:var(--muted); }
  .flow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:10px 0; font-size:calc(16px*var(--k,1)); }
  .flow span { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:5px 10px; } .flow i { font-style:normal; color:var(--muted); }
  .q { border-top:1px solid var(--border); padding:10px 0; }
  .q:first-child { border-top:0; }
  .q b { display:block; font-size:calc(18px*var(--k,1)); }
  .q button { margin-top:6px; border:1px solid var(--blue); background:none; color:var(--blue); font:inherit; font-size:calc(15px*var(--k,1)); padding:4px 12px; border-radius:999px; cursor:pointer; }
  .q p { display:none; margin:6px 0 0; font-size:calc(17px*var(--k,1)); background:var(--bg); border-radius:12px; padding:8px 12px; }
  .q:not(.mcq).open p { display:block; } .q:not(.mcq).open button { display:none; }
  .mcq { margin-top:16px; padding-top:14px; }
  .mcq .check-label { color:var(--blue); font-size:calc(14px*var(--k,1)); margin-bottom:6px; }
  .mcq fieldset { border:0; margin:0; padding:0; min-width:0; }
  .mcq legend { padding:0; font-weight:700; font-size:calc(18px*var(--k,1)); line-height:1.6; }
  .mcq .choices { display:grid; gap:8px; margin:10px 0; }
  .mcq .choice { display:flex; align-items:flex-start; gap:9px; text-align:left; border-radius:12px; padding:10px 12px; min-height:44px; margin:0; width:100%; color:var(--text); border-color:var(--border); background:var(--bg); line-height:1.6; overflow-wrap:anywhere; }
  .mcq .choice span:first-child { color:var(--blue); flex:none; }
  .mcq .choice:focus-visible, .mcq .retry:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
  .mcq .choice:disabled { cursor:default; opacity:1; }
  .mcq .choice.is-correct { border:2px solid var(--sage); }
  .mcq .choice.is-wrong { border:2px solid var(--red); }
  .q.mcq p:not([hidden]) { display:block; }
  .mcq .feedback { font-weight:700; color:var(--blue); }
  .mcq .explanation { line-height:1.7; }
  .mcq .retry { min-height:44px; }
  .mcq [hidden] { display:none !important; }
  .play { display:flex; align-items:center; gap:10px; margin:12px 0 4px; padding:12px 14px; border-radius:16px; background:var(--wood); color:#fff; text-decoration:none; font-weight:700; font-size:calc(16px*var(--k,1)); }
  .play small { display:block; font-weight:400; opacity:.9; font-size:calc(13px*var(--k,1)); }
  .game { border-color:var(--wood); }
  .game .gh { display:flex; justify-content:space-between; align-items:center; font-size:calc(14px*var(--k,1)); color:var(--muted); margin-top:12px; }
  .game .gh b { color:var(--wood); }
  .game .what { font-size:calc(19px*var(--k,1)); font-weight:700; margin:6px 0; } .game .from { font-size:calc(13px*var(--k,1)); color:var(--muted); }
  .game .ch4 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0; }
  .game .ch4 button { border:1px solid var(--border); background:var(--bg); color:var(--text); font:inherit; font-size:calc(15px*var(--k,1)); padding:10px 6px; border-radius:12px; cursor:pointer; }
  .game .ch4 button.ok { background:var(--sage); border-color:var(--sage); color:#fff; } .game .ch4 button.ng { border-color:var(--red); }
  .game .why { background:var(--bg); border-radius:12px; padding:8px 12px; font-size:calc(15px*var(--k,1)); }
  .game .nx { margin-top:8px; border:0; border-radius:999px; background:var(--wood); color:#fff; font:inherit; font-weight:700; padding:7px 16px; cursor:pointer; }
  .err { color:var(--muted); text-align:center; margin-top:40px; }
</style>
</head>
<body>
<main>
  <div class="top"><a href="../">とわなにか</a><span class="fz"><button id="fm" aria-label="文字を小さく">A−</button><button id="fp" aria-label="文字を大きく">A＋</button></span><a id="bk" href="./">‹ 勉強</a></div>
  <div id="doc"><p class="err">読みこみ中…</p></div>
</main>
<script src="practice-state.js"></script>
<script src="practice.js"></script>
<script>
(function () {
  var KS = [0.9, 1, 1.15, 1.3, 1.5], KEY = "hibiki-view-k", i = 1;
  try { var v = parseFloat(localStorage.getItem(KEY)); if (KS.indexOf(v) >= 0) i = KS.indexOf(v); } catch (e) {}
  function set() { document.documentElement.style.setProperty("--k", KS[i]); try { localStorage.setItem(KEY, KS[i]); } catch (e) {} }
  set();
  document.getElementById("fm").onclick = function () { if (i > 0) { i--; set(); } };
  document.getElementById("fp").onclick = function () { if (i < KS.length - 1) { i++; set(); } };
})();
// 勉強ノート（md）を絵つきで表示する。?n=ch7 なら notes/ch7.md を読む。
// md の中の ```bars ```timeline ```eq ```flow ```quiz を図にする（書き方は notes/README.md）
var COL = { b: "var(--blue)", s: "var(--sage)", w: "var(--wood)", r: "var(--red)", m: "var(--muted)" };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function rows(t) { return t.trim().split("\n").filter(Boolean).map(function (l) { return l.split("|").map(function (x) { return x.trim(); }); }); }
var BLOCK = {
  // ラベル | 値 | 表示（省略可）| 色 b s w r m（省略可）。最大値は自動
  bars: function (t) {
    var r = rows(t), max = Math.max.apply(null, r.map(function (x) { return +x[1]; }));
    return '<div class="bars">' + r.map(function (x) {
      return '<div class="bar"><span>' + esc(x[0]) + '</span><span class="tr"><i style="width:' + (+x[1] / max * 100) + '%;background:' + (COL[x[3]] || COL.b) + '"></i></span><b>' + esc(x[2] || x[1]) + '</b></div>';
    }).join("") + '</div>';
  },
  // 年 | できごと | ひとこと（省略可）
  timeline: function (t) {
    return '<div class="tl">' + rows(t).map(function (x) { return '<div><b>' + esc(x[0]) + '</b>' + esc(x[1]) + (x[2] ? '<small>' + esc(x[2]) + '</small>' : '') + '</div>'; }).join("") + '</div>';
  },
  // 予測 + 判断 = 決定
  eq: function (t) {
    return '<div class="eq">' + t.trim().split(/\s+/).map(function (w) { return /^[+=×→−]$/.test(w) ? '<i>' + w + '</i>' : '<span>' + esc(w) + '</span>'; }).join("") + '</div>';
  },
  // A → B → C
  flow: function (t) {
    return '<div class="flow">' + t.trim().split(/\s*→\s*/).map(function (w) { return '<span>' + esc(w) + '</span>'; }).join("<i>→</i>") + '</div>';
  },
  // 4択は Q / 1〜4 / C（正答番号）/ E（解説）。従来の Q / A も読める。
  quiz: function (t) {
    var out = [], cur = null, part = "q", choice = -1;
    t.split("\n").forEach(function (l) {
      var opt = l.match(/^([1-4])[:：]\s*(.*)$/);
      if (/^Q[:：]/.test(l)) { cur = { q: l.replace(/^Q[:：]\s*/, ""), a: "", options: [], correct: 0, explanation: "" }; out.push(cur); part = "q"; }
      else if (!cur) return;
      else if (opt) { choice = +opt[1] - 1; cur.options[choice] = opt[2]; part = "option"; }
      else if (/^C[:：]/.test(l)) { cur.correct = +l.replace(/^C[:：]\s*/, ""); part = "correct"; }
      else if (/^E[:：]/.test(l)) { cur.explanation = l.replace(/^E[:：]\s*/, ""); part = "explanation"; }
      else if (/^A[:：]/.test(l)) { cur.a = l.replace(/^A[:：]\s*/, ""); part = "a"; }
      else if (l.trim() && part !== "correct") {
        if (part === "option") cur.options[choice] += "\n" + l.trim();
        else cur[part] += "\n" + l.trim();
      }
    });
    return '<div class="quiz">' + out.map(function (x) {
      if (!x.options.length) return '<div class="q"><b>' + lineText(x.q) + '</b><button>答えを見る</button><p>' + lineText(x.a) + '</p></div>';
      if (x.options.length !== 4 || [0,1,2,3].some(function (i) { return !x.options[i] || !x.options[i].trim(); }) || !Number.isInteger(x.correct) || x.correct < 1 || x.correct > 4 || !x.explanation.trim()) return '<p class="err">確認問題を読み込めませんでした。</p>';
      return '<div class="q mcq" data-correct="' + (x.correct - 1) + '"><div class="check-label">ここで確認・4択</div><fieldset><legend>' + lineText(x.q) + '</legend><div class="choices">' + x.options.map(function (option, i) {
        return '<button type="button" class="choice" data-choice="' + i + '"><span>' + (i + 1) + '</span><span>' + lineText(option) + '</span></button>';
      }).join("") + '</div></fieldset><p class="feedback" role="status" hidden></p><p class="explanation" hidden>' + lineText(x.explanation) + '</p><button type="button" class="retry" hidden>もう一度考える</button></div>';
    }).join("") + '</div>';
  }
};
// 小さな md の読み方：見出し・段落・箇条書き・表・引用・太字・図ブロック
// 教材に書いた改行と、属性のない br だけを改行として表示する。
// その他のHTMLは文字として扱う。
function lineText(t) {
  return esc(String(t).replace(/(?: {2,}|\\)\n/g, "\n")).replace(/&lt;br\s*\/?&gt;/gi, "<br>").replace(/\n/g, "<br>");
}
function inl(t) { return lineText(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>'); }
function cells(l) { return l.trim().replace(/^\||\|$/g, "").split("|").map(function (x) { return x.trim(); }); }
function md(src) {
  var L = src.replace(/\r\n?/g, "\n").split("\n"), out = [], i = 0;
  while (i < L.length) {
    var l = L[i];
    if (/^```/.test(l)) { var lang = l.slice(3).trim(), buf = []; i++; while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]); i++; out.push(BLOCK[lang] ? BLOCK[lang](buf.join("\n")) : "<pre>" + esc(buf.join("\n")) + "</pre>"); continue; }
    var h = l.match(/^(#{1,3})\s+(.*)/); if (h) { out.push("<h" + h[1].length + ">" + inl(h[2]) + "</h" + h[1].length + ">"); i++; continue; }
    if (/^---\s*$/.test(l) || !l.trim()) { i++; continue; }
    if (/^\|/.test(l)) { var t = []; while (i < L.length && /^\|/.test(L[i])) t.push(L[i++]); var head = cells(t[0]), body = t.slice(2);
      out.push('<div class="tw"><table><thead><tr>' + head.map(function (c) { return "<th>" + inl(c) + "</th>"; }).join("") + "</tr></thead><tbody>" + body.map(function (r) { return "<tr>" + cells(r).map(function (c) { return "<td>" + inl(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>"); continue; }
    if (/^\s*([-*]|\d+\.)\s/.test(l)) { var ol = /^\s*\d+\./.test(l), items = [];
      while (i < L.length && /^\s*([-*]|\d+\.)\s/.test(L[i])) {
        var d = /^\s{2,}/.test(L[i]), item = [L[i++].replace(/^\s*([-*]|\d+\.)\s+/, "")];
        while (i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*]|\d+\.)\s/.test(L[i]) && !/^\s*```/.test(L[i])) item.push(L[i++].trim());
        items.push((d ? '<li style="margin-left:1.2em;list-style:circle">' : "<li>") + inl(item.join("\n")) + "</li>");
      }
      out.push((ol ? "<ol>" : "<ul>") + items.join("") + (ol ? "</ol>" : "</ul>")); continue; }
    if (/^>\s?/.test(l)) {
      var quote = []; while (i < L.length && /^>/.test(L[i])) quote.push(L[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + inl(quote.join("\n")) + "</blockquote>"); continue;
    }
    var p = []; while (i < L.length && L[i].trim() && !/^(#{1,3}\s|```|\||>|---\s*$|\s*([-*]|\d+\.)\s)/.test(L[i])) p.push(L[i++]); out.push("<p>" + inl(p.join("\n")) + "</p>");
  }
  return out.join("\n");
}

var n = (new URLSearchParams(location.search).get("n") || "").replace(/[^a-z0-9-]/g, "");
if (/^ch\d/.test(n)) { var bk = document.getElementById("bk"); bk.href = "digital.html"; bk.textContent = "‹ デジタル経済"; }
fetch("notes/" + n + ".md", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (text) {
  var html = md(text), box = document.createElement("div"); box.innerHTML = html;
  // h2 ごとにカードにする
  var doc = document.getElementById("doc"); doc.innerHTML = "";
  var sec = null, toc = [], i = 0;
  Array.prototype.slice.call(box.childNodes).forEach(function (el) {
    if (el.tagName === "H1") { document.title = el.textContent + " — とわなにか"; doc.appendChild(el); var t = document.createElement("div"); t.className = "toc"; doc.appendChild(t); return; }
    if (el.tagName === "H2") { sec = document.createElement("section"); el.id = "s" + (++i); toc.push('<a href="#s' + i + '">' + esc(el.textContent.replace(/^\d+\.\s*/, "").split(/[：:]/)[0]) + '</a>'); doc.appendChild(sec); }
    (sec || doc).appendChild(el);
  });
  var t = doc.querySelector(".toc"); if (t) t.innerHTML = toc.join("");
  window.dispatchEvent(new Event("studylessonready"));
  // 動画を確認できていない場合も、未確認の動画を推薦せずテーマ検索へ案内する。
  var title = doc.querySelector("h1");
  var subject = title ? title.textContent.replace(/\s*\d+講.*$/, "").trim() : "";
  var blockchainTopics = ["ブロックチェーン 台帳 信頼", "ブロックチェーン ハッシュ 電子署名", "ブロックチェーン 合意形成 PoW PoS", "ブロックチェーン 許可型 パブリック型", "ブロックチェーン オラクル問題 入力情報 真偽", "スマートコントラクト 仕組み", "CBDC 銀行預金 暗号資産 違い"];
  Array.prototype.filter.call(doc.querySelectorAll("section"), function (section) {
    return !section.matches('.practice-panel,.practice-result,.practice-review');
  }).forEach(function (section, index) {
    var heading = section.querySelector("h2");
    if (!heading) return;
    var topic = heading.textContent.replace(/^\d+[.．、]\s*/, "").trim();
    if (/持ち帰る|まとめ|出典|参考|復習|覚えておく/.test(topic)) return;
    var query = n === "ch8" && blockchainTopics[index] ? blockchainTopics[index] : subject + " " + topic;
    var more = document.createElement("details"); more.className = "video-more";
    var summary = document.createElement("summary"); summary.textContent = "動画で深める";
    var link = document.createElement("a");
    link.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query + " 日本語 解説");
    link.target = "_blank"; link.rel = "noopener noreferrer";
    link.textContent = "YouTubeで検索 ↗";
    link.setAttribute("aria-label", topic + "をYouTubeで検索（新しいタブ）");
    var hint = document.createElement("small"); hint.textContent = "このテーマの日本語解説を探します。検索結果は講義の出典ではありません。";
    more.appendChild(summary); more.appendChild(link); more.appendChild(hint); section.appendChild(more);
  });

  // ゲームと質問バーのある版（claude.ai のページ）。作り方は /mnt/project-files/hibiki/study/chat/
  var MACRO = "https://claude.ai/artifact/JwgD4K9REUU99uP2QTMidM";
  var PLAY = { money8: ["https://claude.ai/artifact/XNJLBbXKYk6YucU5ZbLXUD", "銀行ゲーム"] };
  for (var m = 8; m <= 15; m++) PLAY["macro" + m] = [MACRO, "上がる？下がる？ゲーム"];
  var TRAD = "https://claude.ai/artifact/Hu2zBktAmv2FB6vzGMVB9n";
  PLAY.tradition7 = PLAY.tradition8 = [TRAD, "4択ゲーム"];
  if (PLAY[n] && t) { var a = document.createElement("a"); a.className = "play"; a.href = PLAY[n][0]; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = "▶ Claude に聞く<small>質問バー・Claude が作る問題（claude.ai で開く）</small>"; t.after(a); }
  var dc = n.match(/^ch(\d+)$/);
  if (dc) {
    var DIGITAL_NOTES = { 7: "AI", 8: "ブロックチェーン", 9: "ゲーム", 10: "メディア", 11: "共有", 12: "移動", 13: "利益", 14: "仕事", 15: "格差" }, nav = document.createElement("div"); nav.className = "toc lec";
    nav.innerHTML = Object.keys(DIGITAL_NOTES).map(function (k) { return '<a href="?n=ch' + k + '"' + (+k === +dc[1] ? ' aria-current="page"' : '') + '>' + k + '講 ' + DIGITAL_NOTES[k] + '</a>'; }).join('');
    doc.insertBefore(nav, doc.firstChild);
  }
  // 上級マクロ経済論は 8〜15講をならべて、となりの講へ行けるようにする
  var SERIES = { macro: { 8:"消費", 9:"投資", 10:"労働", 11:"お金", 12:"一般均衡", 13:"均衡の波", 14:"不均衡の波", 15:"成長" }, tradition: { 7:"食の暮らし", 8:"訴え状" } };
  SERIES.money = { 8:"お金の増える仕組み", 9:"お金の増え方" };
  SERIES.religion = { 8:"仏教", 9:"3つの宗教" };
  var mm = n.match(/^(macro|tradition|money|religion)(\d+)$/);
  if (mm) { var LEC = SERIES[mm[1]], row = document.createElement("div"); row.className = "toc lec";
    row.innerHTML = Object.keys(LEC).map(function (k) { return '<a href="?n=' + mm[1] + k + '"' + (+k === +mm[2] ? ' aria-current="page"' : "") + '>' + k + '講 ' + LEC[k] + '</a>'; }).join("");
    doc.insertBefore(row, doc.firstChild); }
  // ゲーム（サイトの中で遊べる4択。問題は games/<科目>.json）
  if (mm && (mm[1] === "macro" || mm[1] === "tradition")) fetch("games/" + mm[1] + ".json", { cache:"no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (G) {
    var list = G && G[mm[2]]; if (!list || !list.length) return;
    var DIRS = ["ふえる・上がる ↑", "へる・下がる ↓", "変わらない →", "どちらもある ？"], XK = "hibiki-" + mm[1] + "-xp", xp = 0;
    try { xp = +localStorage.getItem(XK) || 0; } catch (e) {}
    var box = document.createElement("section"); box.className = "game"; box.innerHTML = "<h2>あそんで覚える</h2><div class='gh'><span>Lv <b class='lv'></b>（" + "XP <b class='xp'></b>）</span><span>正解 <b class='ok'>0</b> / " + list.length + "</span></div><div class='q4'></div>";
    var anchor = doc.querySelector(".play") || doc.querySelector(".toc:not(.lec)"); anchor.after(box);
    var q = list.slice().sort(function () { return Math.random() - .5; }), i = 0, ok = 0, area = box.querySelector(".q4");
    function hud() { box.querySelector(".lv").textContent = Math.floor(xp / 50) + 1; box.querySelector(".xp").textContent = xp; box.querySelector(".ok").textContent = ok; }
    function next() {
      if (i >= q.length) { area.innerHTML = "<p class='what'>ぜんぶ終わり！ " + ok + " 問正解</p><button type='button' class='nx'>もう一周</button>"; area.querySelector("button").onclick = function () { i = 0; ok = 0; q.sort(function () { return Math.random() - .5; }); hud(); next(); }; return; }
      var it = q[i], ch = it[4] || DIRS;
      area.innerHTML = "<div class='from'>" + esc(it[0]) + "</div><div class='what'>" + esc(it[1]) + "</div><div class='ch4'>" + ch.map(function (c, k) { return "<button type='button' data-k='" + k + "'>" + esc(c) + "</button>"; }).join("") + "</div>";
      area.querySelectorAll(".ch4 button").forEach(function (b) { b.onclick = function () {
        var right = +b.dataset.k === it[2];
        if (window.StudyPractice) StudyPractice.feedback(right);
        area.querySelectorAll(".ch4 button").forEach(function (x) { x.disabled = true; if (+x.dataset.k === it[2]) x.classList.add("ok"); });
        if (!right) b.classList.add("ng"); else { ok++; xp += 10; try { localStorage.setItem(XK, xp); } catch (e) {} }
        hud(); i++;
        var w = document.createElement("div"); w.innerHTML = "<div class='why'>" + (right ? "正解！ +10 XP　" : "ざんねん。") + esc(it[3]) + "</div><button type='button' class='nx'>次へ</button>"; area.appendChild(w);
        w.querySelector("button").onclick = next; }; });
    }
    hud(); next();
  });
}).catch(function () { document.getElementById("doc").innerHTML = '<p class="err">ノートが見つかりません</p>'; });
document.addEventListener("click", function (e) {
  var b = e.target.closest(".q button"); if (!b) return;
  var q = b.closest(".q");
  if (!q.classList.contains("mcq")) { q.classList.add("open"); return; }
  var choices = q.querySelectorAll(".choice"), feedback = q.querySelector(".feedback"), explanation = q.querySelector(".explanation"), retry = q.querySelector(".retry");
  if (b.classList.contains("retry")) {
    q.removeAttribute("data-answered");
    choices.forEach(function (choice) { choice.disabled = false; choice.classList.remove("is-correct", "is-wrong"); });
    feedback.hidden = true; feedback.textContent = ""; explanation.hidden = true; retry.hidden = true;
    var note = q.querySelector('.recall-note'); if (note) note.remove();
    choices[0].focus(); return;
  }
  if (!b.classList.contains("choice") || q.hasAttribute("data-answered")) return;
  var correct = +q.dataset.correct, chosen = +b.dataset.choice;
  q.setAttribute("data-answered", "true");
  choices.forEach(function (choice, i) { choice.disabled = true; if (i === correct) choice.classList.add("is-correct"); });
  if (chosen !== correct) b.classList.add("is-wrong");
  feedback.textContent = chosen === correct ? "正解です。理由も確かめよう。" : "正解は「" + (correct + 1) + "」。説明を読んで確かめよう。";
  feedback.hidden = false; explanation.hidden = false; retry.hidden = false;
  if (window.StudyPractice) StudyPractice.answer(q, chosen === correct);
});
</script>
