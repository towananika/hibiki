    pic: [P(["高い技能 ↑"]), P(["真ん中 ↓"]), P(["低い技能 ↑"]), "仕事の二極化<small>世界の上位10%が、資産の76%を持つ（2021年）</small>"],
    terms: [["定型偏向的な技術変化", "정형편향적 기술변화 RBTC", "決まった手順の仕事ほど機械に代わる。中間層がやせる"], ["技能偏向的な技術変化", "숙련편향적 기술변화 SBTC", "技術が高い技能の人を助け、賃金の差が広がる"], ["ジニ係数", "지니계수", "0なら完全に平等、1なら一人がすべてを持つ"]],
    me: "所得より資産の差の方が大きい。ひびきが「自由の日」に向けて資産を育てているのは、ここに効く。" }
];
var KEY = "hibiki-study-digital-v1";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
function partOf(i) { var p = PARTS[0]; PARTS.forEach(function (x) { if (i + 1 >= x.from) p = x; }); return p; }

var html = "";
CH.forEach(function (c, i) {
  var p = partOf(i);
  if (i + 1 === p.from) html += '<div class="part"><b style="color:' + p.c + '">' + p.n + '</b><span>' + p.s + '</span></div>';
  html += '<div class="ch" id="c' + i + '"><button data-o="' + i + '"><span class="num" style="background:' + p.c + '">' + (i + 1) + '</span>' +
    '<span class="ttl"><b>' + c.t + '</b><small>' + c.k + '</small></span><span class="chev">›</span></button>' +
    '<div class="in"><p class="one">' + c.one + '</p><div class="pic">' + c.pic.map(function (r) { return '<div class="row">' + r + '</div>'; }).join("") + '</div>' +
    '<div class="terms">' + c.terms.map(function (t) { return '<div class="term"><b>' + t[0] + '</b><em>' + t[1] + '</em><br>' + t[2] + '</div>'; }).join("") + '</div>' +
    '<div class="me"><b>ひびきの暮らしでいうと</b>' + c.me + '</div>' +
    '<button class="read" data-r="' + i + '">わかった</button></div></div>';
});
document.getElementById("list").innerHTML = html;

function paint() {
  var S = load(), n = 0;
  CH.forEach(function (c, i) { var on = !!S[i]; if (on) n++; var el = document.getElementById("c" + i); el.classList.toggle("done", on); el.querySelector(".num").textContent = on ? "✓" : i + 1; el.querySelector(".read").textContent = on ? "わかった ✓" : "わかった"; });
  document.getElementById("pN").textContent = n + " / 15章";
  document.getElementById("ring").style.strokeDashoffset = 94.25 * (1 - n / 15);
  document.getElementById("dots").innerHTML = CH.map(function (c, i) { return '<i style="' + (S[i] ? 'background:' + partOf(i).c : '') + '"></i>'; }).join("");
}
document.getElementById("list").addEventListener("click", function (ev) {
  var b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.o != null) document.getElementById("c" + b.dataset.o).classList.toggle("open");
  if (b.dataset.r != null) { var S = load(); S[b.dataset.r] = S[b.dataset.r] ? 0 : Date.now(); save(S); paint(); }
});
paint();
</script>
