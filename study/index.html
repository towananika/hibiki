<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勉強 — とわなにか</title>
<meta name="description" content="受けている科目をえらんで、1つずつ勉強する。">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<script src="../sync.js"></script>
<meta name="theme-color" content="#74886d">
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271; --wood:#93704b; --sage:#74886d; --sage-soft:#e2e8dd; --blue:#5b7a99; --blue-soft:#dde6ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a; --wood:#c99f74; --sage:#9db394; --sage-soft:#26301f; --blue:#8fb0cf; --blue-soft:#222d37; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:28px 16px 32px; }
  .brand { color:var(--sage); font-size:14px; letter-spacing:.1em; font-weight:600; text-decoration:none; }
  h1 { font-size:26px; margin:16px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 6px; }
  a.sj { display:flex; gap:14px; align-items:center; margin-top:14px; padding:16px; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--border); border-radius:20px; }
  .ic { flex:none; width:48px; height:48px; border-radius:14px; display:grid; place-items:center; color:#fff; font-size:22px; font-weight:700; }
  .t { flex:1; min-width:0; } .t b { display:block; font-size:17px; } .t small { color:var(--muted); font-size:12px; display:block; }
  .meter { height:6px; border-radius:3px; background:var(--border); margin-top:8px; overflow:hidden; } .meter i { display:block; height:100%; background:var(--sage); width:0; }
  .chev { color:var(--muted); font-size:20px; }
  .new { font-size:11px; background:var(--wood); color:#fff; border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:2px; }
  footer { color:var(--muted); font-size:12px; margin-top:18px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<main>
  <a class="brand" href="../">とわなにか</a>
  <h1>勉強</h1>
  <p class="sub">科目をえらんでください</p>

  <a class="sj" href="digital.html">
    <span class="ic" style="background:var(--sage)">経</span>
    <span class="t"><b>デジタル経済の理解</b><small>放送大学 経済学科・全15章</small>
      <span class="meter"><i id="mDig"></i></span><small id="nDig">0 / 15章</small></span>
    <span class="chev">›</span>
  </a>

  <a class="sj" href="view.html?n=tradition7">
    <span class="ic" style="background:var(--blue)">食</span>
    <span class="t"><b>伝統社会と生活文化<span class="new">NEW</span></b><small>放送大学・7講「食と食生活文化」</small></span>
    <span class="chev">›</span>
  </a>

  <a class="sj" href="words.html">
    <span class="ic" style="background:var(--wood)">言</span>
    <span class="t"><b>あとで聞く言葉</b><small>知らない言葉を選んで、あとで答えを見る</small><small id="nW"></small></span>
    <span class="chev">›</span>
  </a>

  <footer>科目が増えたら、ここに並びます。<br>講義ノートをもとに、自分の言葉で短くまとめたものです。</footer>
</main>
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem("hibiki-study-digital-v1")) || {}, n = 0;
    for (var k in s) if (s[k] && +k >= 0 && +k < 15) n++;
    document.getElementById("nDig").textContent = n + " / 15章";
    document.getElementById("mDig").style.width = (n / 15 * 100) + "%";
  } catch (e) {}
  try { var w = JSON.parse(localStorage.getItem("hibiki-words-v1")) || []; if (w.length) document.getElementById("nW").textContent = w.length + " 個たまっています"; } catch (e) {}
})();
</script>
</body>
</html>
