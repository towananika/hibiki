<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勉強 — とわなにか</title>
<meta name="description" content="受けている科目をえらんで、1つずつ勉強する。">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<script src="../sync.js"></script>
<meta name="theme-color" content="#74886d">
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271; --wood:#93704b; --sage:#74886d; --sage-soft:#e2e8dd; --blue:#5b7a99; --blue-soft:#dde6ee; --red:#a8553f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a; --wood:#c99f74; --sage:#9db394; --sage-soft:#26301f; --blue:#8fb0cf; --blue-soft:#222d37; --red:#d98a72; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:28px 16px 32px; }
  .brand { color:var(--sage); font-size:14px; letter-spacing:.1em; font-weight:600; text-decoration:none; }
  h1 { font-size:26px; margin:16px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 6px; }
  .sj { display:flex; gap:14px; align-items:center; margin-top:14px; padding:16px; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--border); border-radius:20px; }
  .ic { flex:none; width:48px; height:48px; border-radius:14px; display:grid; place-items:center; color:#fff; font-size:22px; font-weight:700; }
  .t { flex:1; min-width:0; } .t b { display:block; font-size:17px; } .t small { color:var(--muted); font-size:12px; display:block; }
  .chev { color:var(--muted); font-size:20px; }
  .due { margin-top:12px; padding:12px 14px; border-radius:16px; background:var(--sage-soft); font-size:14px; line-height:1.6; }
  .due b { font-size:20px; }
  .ev { display:inline-block; margin-top:6px; font-size:12px; color:var(--blue); background:var(--blue-soft); border-radius:999px; padding:0 10px; cursor:pointer; border:0; font-family:inherit; }

  .plan h3 { font-size:15px; margin:0 0 8px; }
  .plan-note { font-size:13px; color:var(--muted); line-height:1.7; }
  .plan button, .plan select, .plan input { font:inherit; }
  .plan button { border:1px solid var(--blue); border-radius:10px; background:var(--blue-soft); color:var(--blue); padding:9px 11px; cursor:pointer; min-height:44px; }
  .plan button:focus-visible, .plan input:focus-visible, .plan select:focus-visible, .plan a:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
  .plan-course { border-top:1px solid var(--border); padding:12px 0; }
  .plan-lessons { display:flex; flex-wrap:wrap; gap:8px; }
  .plan-lesson { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:2px 10px; border:1px solid var(--border); border-radius:10px; }
  .plan-lesson label { display:flex; align-items:center; gap:6px; min-height:44px; cursor:pointer; }
  .plan input[type=checkbox] { width:20px; height:20px; accent-color:var(--sage); }
  .plan-lesson:has(input:checked) { background:var(--sage-soft); }
  .plan-lesson a { color:var(--blue); padding:12px 0; font-size:13px; }
  .plan-lesson small { color:var(--muted); font-size:11px; }
  .course-link { display:flex; align-items:center; gap:8px; color:inherit; text-decoration:none; min-height:32px; }
  .course-link b { flex:1; min-width:0; }
  .subject-card .chev { font-size:18px; }
  .course-graph { display:block; width:100%; border:0; background:none; color:var(--muted); padding:7px 0 0; text-align:left; font:inherit; cursor:pointer; min-height:44px; }
  .course-graph:focus-visible, .course-link:focus-visible { outline:3px solid var(--blue); outline-offset:3px; border-radius:4px; }
  .chart-track { display:flex; gap:3px; height:6px; }
  .chart-segment { flex:1; min-width:0; background:var(--border); border-radius:2px; }
  .chart-segment.is-done { background:var(--sage); }
  .chart-segment.is-goal { background:var(--blue); }
  .chart-segment.is-goal.is-done { background:var(--sage); outline:1px solid var(--blue); outline-offset:1px; }
  .chart-caption .week-tag { display:inline-block; color:var(--blue); }
  .chart-caption .done-tag { display:inline-block; margin-left:6px; padding:2px 7px; border-radius:999px; background:var(--sage-soft); color:var(--sage); font-weight:700; }
  .chart-segment.is-goal.is-done { outline-width:2px; }
  .material-summary { color:var(--muted); font-size:11px; line-height:1.6; margin:3px 0 0; }
  .material-state { display:inline-block; margin-left:6px; padding:1px 5px; border:1px solid var(--border); border-radius:5px; color:var(--muted); font-size:11px; }
  .material-state.is-ready { color:var(--blue); border-color:var(--blue); }
  .plan-lesson .material-ready { font-weight:600; }
  .chart-caption { display:block; font-size:11px; text-align:right; margin-top:6px; color:var(--blue); }
  .study-legend { display:flex; justify-content:flex-end; gap:12px; margin:12px 0 0; color:var(--muted); font-size:11px; }
  .study-legend span { display:inline-flex; align-items:center; gap:4px; }
  .study-legend i { width:8px; height:6px; border-radius:2px; }
  .legend-done { background:var(--sage); } .legend-goal { background:var(--blue); }
  .study-records > summary { min-height:44px; display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--muted); cursor:pointer; list-style:none; }
  .study-records > summary::-webkit-details-marker { display:none; }
  .study-records > summary::after { content:'＋'; font-size:16px; }
  .study-records[open] > summary::after { content:'−'; }
  #eval-list { display:grid; gap:8px; padding-bottom:12px; }
  #eval-list .ev { margin:0; padding:10px; text-align:left; min-height:44px; }
  #progress-dialog { width:calc(100% - 32px); max-width:480px; max-height:85dvh; overflow:auto; border:1px solid var(--border); border-radius:18px; padding:20px; background:var(--surface); color:var(--text); }
  #progress-dialog::backdrop { background:rgba(0,0,0,.4); }
  #progress-title { font-size:20px; margin:0; }
  #progress-list h3 { display:none; }
  .progress-heading { display:flex; align-items:center; gap:12px; position:sticky; top:-20px; background:var(--surface); padding:8px 0; }
  #progress-title { flex:1; }
  #progress-close { flex-shrink:0; }
  #plan-status { color:var(--red); font-size:13px; }
  #plan-status:empty { display:none; }
  footer { color:var(--muted); font-size:12px; margin-top:18px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<main>
  <a class="brand" href="../">とわなにか</a>
  <h1>勉強</h1>
  <p class="sub">受けている科目を、1つずつ</p>

  <div class="due" id="due"></div>
  <p class="study-legend"><span><i class="legend-done" aria-hidden="true"></i>完了</span><span><i class="legend-goal" aria-hidden="true"></i><span id="goal-legend">今週</span></span></p>
  <div id="subjects"></div>
  <div class="plan" id="study-progress"></div>
  <details class="study-records"><summary>形成評価の記録</summary><div id="eval-list"></div></details>

  <a class="sj" href="words.html">
    <span class="ic" style="background:var(--wood)">言</span>
    <span class="t"><b>あとで聞く言葉</b><small>知らない言葉を選んで、あとで答えを見る</small><small id="nW"></small></span>
    <span class="chev">›</span>
  </a>

  <footer>科目が増えたら、ここに並びます。<br>講義ノートをもとに、自分の言葉で短くまとめたものです。</footer>
</main>
<script>
(function () {
  // 受けている科目（2026年2学期・韓国の放送大学）。教材ができたら href を入れる
  var SUBJECTS = [
    { k: "dig", name: "デジタル経済の理解", href: "digital.html", c: "var(--sage)", ch: "経" },
    { k: "trad", name: "伝統社会と生活文化", href: "view.html?n=tradition8", c: "var(--blue)", ch: "食" },
    { k: "money", name: "貨幣金融論", href: "view.html?n=money9", c: "var(--red)", ch: "貨" },
    { k: "macro", name: "上級マクロ経済論", href: "view.html?n=macro8", c: "var(--wood)", ch: "マ" },
    { k: "rel", name: "世界の宗教", href: "view.html?n=religion8", c: "var(--blue)", ch: "宗" },
    { k: "open", name: "開かれた社会と21世紀", href: "view.html?n=open8", c: "var(--wood)", ch: "社" }
  ];
  function jget(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function render() {
    var EV = jget("hibiki-study-eval-v1", {});
    document.getElementById("subjects").innerHTML = SUBJECTS.map(function (x) {
      var tag = x.href ? "a" : "div", h = x.href ? ' href="' + x.href + '"' : "";
      return '<article class="sj subject-card" data-subject="' + x.k + '">' +
        '<span class="ic" style="background:' + x.c + '">' + x.ch + '</span>' +
        '<div class="t"><' + tag + ' class="course-link"' + h + '><b>' + esc(x.name) + '</b>' +
        (x.href ? '<span class="chev" aria-hidden="true">›</span>' : '') + '</' + tag + '>' +
        '<div data-subject-graph="' + x.k + '"></div></div></article>';
    }).join("");
    document.getElementById("eval-list").innerHTML = SUBJECTS.map(function (x) {
      var ev = EV[x.k];
      return '<button class="ev" data-k="' + x.k + '">' + esc(x.name) + '：' + (ev == null ? "未記録" : ev + "%") + '（直す）</button>';
    }).join("");
    [].forEach.call(document.querySelectorAll(".ev"), function (b) {
      b.onclick = function (e) {
        e.preventDefault(); e.stopPropagation();
        var k = b.getAttribute("data-k"), v = prompt("形成評価の進み具合（％）を入れてください", EV[k] == null ? "" : EV[k]);
        if (v === null) return;
        var num = parseFloat(v), M = jget("hibiki-study-eval-v1", {});
        if (isNaN(num)) delete M[k]; else M[k] = Math.max(0, Math.min(100, Math.round(num * 100) / 100));
        try { localStorage.setItem("hibiki-study-eval-v1", JSON.stringify(M)); } catch (e2) {}
        render();
      };
    });
    var w = jget("hibiki-words-v1", []);
    document.getElementById("nW").textContent = w.length ? w.length + " 個たまっています" : "";
    var end = new Date("2026-12-13T23:59:59+09:00"), left = Math.ceil((end - new Date()) / 864e5);
    document.getElementById("due").innerHTML = left >= 0
      ? '形成評価の期限 <b>12月13日</b>まで、あと <b>' + left + '</b> 日' : '形成評価の期間は終わりました';
    window.dispatchEvent(new Event("studycardsrendered"));
  }
  window.addEventListener("studyprogress", render);
  window.addEventListener("storage", function (e) { if (e.key === "hibiki-study-digital-v1") render(); });
  window.addEventListener("pageshow", render);
  render();
})();
</script>
<script src="plan.js"></script>
<script src="materials.js"></script>
<script src="plan-ui.js"></script>
</body>
</html>
