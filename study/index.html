<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勉強 — とわなにか</title>
<meta name="description" content="受けている科目をえらんで、1つずつ勉強する。">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<script src="../sync.js"></script>
<meta name="theme-color" content="#74886d">
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271; --wood:#93704b; --sage:#74886d; --sage-soft:#e2e8dd; --blue:#5b7a99; --blue-soft:#dde6ee; --red:#a8553f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a; --wood:#c99f74; --sage:#9db394; --sage-soft:#26301f; --blue:#8fb0cf; --blue-soft:#222d37; --red:#d98a72; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:28px 16px 32px; }
  .brand { color:var(--sage); font-size:14px; letter-spacing:.1em; font-weight:600; text-decoration:none; }
  h1 { font-size:26px; margin:16px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 6px; }
  .sj { display:flex; gap:14px; align-items:center; margin-top:14px; padding:16px; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--border); border-radius:20px; }
  .ic { flex:none; width:48px; height:48px; border-radius:14px; display:grid; place-items:center; color:#fff; font-size:22px; font-weight:700; }
  .t { flex:1; min-width:0; } .t b { display:block; font-size:17px; } .t small { color:var(--muted); font-size:12px; display:block; }
  .meter { height:6px; border-radius:3px; background:var(--border); margin-top:8px; overflow:hidden; } .meter i { display:block; height:100%; background:var(--sage); width:0; }
  .chev { color:var(--muted); font-size:20px; }
  .new { font-size:11px; background:var(--wood); color:#fff; border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:2px; }
  .due { margin-top:12px; padding:12px 14px; border-radius:16px; background:var(--sage-soft); font-size:14px; line-height:1.6; }
  .due b { font-size:20px; }
  .sj.soon { opacity:.78; }
  .ev { display:inline-block; margin-top:6px; font-size:12px; color:var(--blue); background:var(--blue-soft); border-radius:999px; padding:0 10px; cursor:pointer; border:0; font-family:inherit; }
  footer { color:var(--muted); font-size:12px; margin-top:18px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<main>
  <a class="brand" href="../">とわなにか</a>
  <h1>勉強</h1>
  <p class="sub">受けている科目を、1つずつ</p>

  <div class="due" id="due"></div>
  <div id="subjects"></div>

  <a class="sj" href="words.html">
    <span class="ic" style="background:var(--wood)">言</span>
    <span class="t"><b>あとで聞く言葉</b><small>知らない言葉を選んで、あとで答えを見る</small><small id="nW"></small></span>
    <span class="chev">›</span>
  </a>

  <footer>科目が増えたら、ここに並びます。<br>講義ノートをもとに、自分の言葉で短くまとめたものです。</footer>
</main>
<script>
(function () {
  // 受けている科目（2026年2学期・韓国の放送大学）。教材ができたら href を入れる
  var SUBJECTS = [
    { k: "dig", name: "デジタル経済の理解", sub: "全15章", href: "digital.html", c: "var(--sage)", ch: "経" },
    { k: "trad", name: "伝統社会と生活文化", sub: "7講「食と食生活文化」", href: "view.html?n=tradition7", c: "var(--blue)", ch: "食" },
    { k: "money", name: "貨幣金融論", sub: "8講「お金はどう増える？」", href: "view.html?n=money8", c: "var(--red)", ch: "貨", isNew: true },
    { k: "macro", name: "上級マクロ経済論", sub: "教材はこれから", c: "var(--wood)", ch: "マ" },
    { k: "rel", name: "世界の宗教", sub: "教材はこれから", c: "var(--wood)", ch: "宗" },
    { k: "open", name: "開かれた社会と21世紀", sub: "教材はこれから", c: "var(--wood)", ch: "社" }
  ];
  function jget(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function render() {
    var dig = jget("hibiki-study-digital-v1", {}), n = 0, EV = jget("hibiki-study-eval-v1", {});
    for (var k in dig) if (dig[k] && +k >= 0 && +k < 15) n++;
    document.getElementById("subjects").innerHTML = SUBJECTS.map(function (x) {
      var ev = EV[x.k], tag = x.href ? "a" : "div", h = x.href ? ' href="' + x.href + '"' : "";
      return '<' + tag + ' class="sj' + (x.href ? "" : " soon") + '"' + h + '>' +
        '<span class="ic" style="background:' + x.c + '">' + x.ch + '</span>' +
        '<span class="t"><b>' + esc(x.name) + (x.isNew ? '<span class="new">NEW</span>' : '') + '</b><small>' + esc(x.sub) + '</small>' +
        (x.k === "dig" ? '<span class="meter"><i style="width:' + (n / 15 * 100) + '%"></i></span><small>' + n + ' / 15章</small>' : '') +
        '<button class="ev" data-k="' + x.k + '">形成評価 ' + (ev == null ? "—" : ev + "%") + '（直す）</button></span>' +
        (x.href ? '<span class="chev">›</span>' : '') + '</' + tag + '>';
    }).join("");
    [].forEach.call(document.querySelectorAll(".ev"), function (b) {
      b.onclick = function (e) {
        e.preventDefault(); e.stopPropagation();
        var k = b.getAttribute("data-k"), v = prompt("形成評価の進み具合（％）を入れてください", EV[k] == null ? "" : EV[k]);
        if (v === null) return;
        var num = parseFloat(v), M = jget("hibiki-study-eval-v1", {});
        if (isNaN(num)) delete M[k]; else M[k] = Math.max(0, Math.min(100, Math.round(num * 100) / 100));
        try { localStorage.setItem("hibiki-study-eval-v1", JSON.stringify(M)); } catch (e2) {}
        render();
      };
    });
    var w = jget("hibiki-words-v1", []);
    document.getElementById("nW").textContent = w.length ? w.length + " 個たまっています" : "";
    var end = new Date("2026-12-13T23:59:59+09:00"), left = Math.ceil((end - new Date()) / 864e5);
    document.getElementById("due").innerHTML = left >= 0
      ? '形成評価の期限 <b>12月13日</b>まで、あと <b>' + left + '</b> 日' : '形成評価の期間は終わりました';
  }
  render();
})();
</script>
</body>
</html>
