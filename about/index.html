<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私について — とわなにか</title>
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271; --wood:#93704b; --wood-soft:#ece1d0; --sage:#74886d; --sage-soft:#e2e8dd; --red:#a8553f; --red-soft:#f0dcd5; --blue:#5b7c99; --blue-soft:#dde6ee; --shadow:0 1px 2px rgba(43,41,36,.05),0 16px 40px rgba(43,41,36,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a; --wood:#c99f74; --wood-soft:#382d20; --sage:#9db394; --sage-soft:#26301f; --red:#d98a72; --red-soft:#3a2620; --blue:#8fb0cc; --blue-soft:#222d37; --shadow:none; } }
  * { box-sizing:border-box; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.6; font-size:16px; }
  main { max-width:480px; margin:0 auto; padding:24px 16px 64px; }
  a.back { color:var(--wood); font-size:14px; text-decoration:none; }
  h1 { font-size:24px; margin:6px 0 4px; }
  .lead { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .btns { display:grid; gap:8px; }
  button { font:inherit; cursor:pointer; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:12px; font-size:15px; text-align:left; }
  button b { display:block; } button span { font-size:12px; color:var(--muted); }
  button.main { background:var(--wood); color:#fff; border-color:var(--wood); } button.main span { color:#f5ead9; }
  .msg { font-size:13px; color:var(--sage); min-height:1.4em; margin-top:8px; }
  .lock { color:var(--muted); font-size:14px; }
  details { border-top:1px solid var(--border); padding:8px 0; } details:first-child { border-top:0; }
  summary { cursor:pointer; font-weight:600; }
  .body { white-space:pre-wrap; word-break:break-word; font-size:13px; color:var(--text); margin-top:6px; }
  .tag { font-size:11px; color:var(--red); background:var(--red-soft); border-radius:999px; padding:0 8px; margin-left:6px; font-weight:400; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0; }
  .seg button { text-align:center; padding:8px; font-size:14px; }
  .seg button.on { background:var(--sage-soft); border-color:var(--sage); font-weight:600; }
  .code { font-size:44px; font-weight:700; letter-spacing:.25em; text-align:center; color:var(--wood); margin:4px 0 0; font-variant-numeric:tabular-nums; }
  .meter { height:6px; background:var(--border); border-radius:999px; overflow:hidden; margin:6px 0 10px; } .meter i { display:block; height:100%; background:var(--sage); transition:width 1s linear; }
  .row2 { display:grid; grid-template-columns:2fr 1fr; gap:8px; } .row2 button { text-align:center; }
  .log { list-style:none; padding:0; margin:10px 0 0; font-size:12px; color:var(--muted); } .log li { display:flex; justify-content:space-between; border-top:1px solid var(--border); padding:4px 0; }
</style>
</head>
<body>
<main>
  <a class="back" href="../">‹ とわなにか</a>
  <header style="display:flex;align-items:center;gap:16px;margin:18px 0 12px"><img src="profile-mandarin.jpg" alt="ひびきのプロフィール画像：みかんのかぶりものをしたキャラクター" width="88" height="88" style="display:block;object-fit:contain;border-radius:8px"><h1>私について</h1></header>
  <p class="lead">ほかのAIに貼るための説明書。コピーして、AIとの会話の最初に貼ってください。</p>
  <p class="lead">Googleログインでは、移行時点の記録を表示します。変更の自動同期はまだ準備中です。</p>
  <div class="card" id="box"><p class="lock">読み込み中…（ログインした端末だけで開けます）</p></div>
  <div class="card" id="ai" style="display:none"></div>
  <div class="card" id="secs" style="display:none"></div>
</main>
<script>
var MD = "";
function strip(md) { return md.split(/\n(?=## )/).filter(function (s) { return !/^## [^\n]*🔒/.test(s); }).join("\n"); }
function copy(t, how) {
  var m = document.getElementById("msg");
  var done = function () { m.textContent = how + "をコピーしました（" + t.length.toLocaleString() + "文字）"; };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () { fallback(t); done(); });
  else { fallback(t); done(); }
}
function fallback(t) { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
function esc(s) { return s.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
function show(D) {
  var box = document.getElementById("box");
  if (!D || !D.md) { MD = ""; document.getElementById("secs").style.display = "none"; document.getElementById("secs").replaceChildren(); aiDraw(null); box.innerHTML = '<p class="lock">記録を開けませんでした。<a href="../sync/">ログインを確認</a></p>'; return; }
  MD = D.md;
  box.innerHTML = '<div class="btns">' +
    '<button class="main" id="all"><b>全文コピー</b><span>自分用のAIに。お金・人間関係も含む</span></button>' +
    '<button id="safe"><b>🔒 を除いてコピー</b><span>信頼できない場所に貼るとき</span></button>' +
    '<button id="url"><b>AI用URLをコピー</b><span>個人情報を抜いた公開版。URLを渡せばAIが自分で読める</span></button></div>' +
    '<div class="msg" id="msg"></div><p class="lock" style="font-size:12px;margin:4px 0 0">更新: ' + esc(String(D.at || "")) + '</p>';
  document.getElementById("all").onclick = function () { copy(MD, "全文"); };
  document.getElementById("url").onclick = function () { copy(new URL("ai.txt", location.href).href, "AI用URL"); };
  document.getElementById("safe").onclick = function () { copy(strip(MD), "🔒 を除いた文"); };
  aiLoad();
  var parts = MD.split(/\n(?=## )/).slice(1);
  var s = document.getElementById("secs"); s.style.display = "block";
  s.innerHTML = parts.map(function (p) {
    var i = p.indexOf("\n"), h = p.slice(3, i).trim(), lock = /🔒/.test(h);
    return '<details><summary>' + esc(h.replace("🔒", "").trim()) + (lock ? '<span class="tag">🔒 個人</span>' : '') + '</summary><div class="body">' + esc(p.slice(i + 1).replace(/\n---\s*$/, "").trim()) + '</div></details>';
  }).join("");
}

// AI用の確認番号（4けた・5分・1回・3回まちがいで消える・読むだけ）
var AI = { scope: "safe", t: null, data: null };
var AI_READ = "https://hibiki-sync.jaykim-can.workers.dev/ai/read";
var AI_END = { read: "AIが読んだ", expired: "時間切れ", locked: "3回まちがいで消えた", revoked: "取り消し", replaced: "新しい番号に交代" };
function hm(t) { var d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
function aiAsk(code) {
  return "ひびきの説明書（私について）を読んでください。確認番号は " + code + " です（5分以内・1回だけ）。\n" +
    "読み方: curl -s -X POST " + AI_READ + " -H \"X-Hibiki-Code: " + code + "\"\n" +
    "番号はURLに入れず、ヘッダーで送ってください。読んだ文は会話の中だけで使い、ほかに保存しないでください。";
}
function aiDraw(st) {
  var el = document.getElementById("ai"); clearInterval(AI.t);
  if (!MD) { el.style.display = "none"; return; }
  el.style.display = "block";
  var a = st && st.active, log = (st && st.log) || [];
  var h = '<b>AIに番号で読ませる</b><p class="lock" style="font-size:12px;margin:2px 0 0">4けた・5分・1回だけ。3回まちがえると消える。読むだけ。</p>';
  if (a) {
    h += '<p class="code">' + esc(a.code) + '</p><p class="lock" style="text-align:center;font-size:12px;margin:0">' + (a.scope === "all" ? "全文" : "🔒 を除く") + '・のこり <span id="ai-left"></span></p>' +
      '<div class="meter"><i id="ai-bar"></i></div><div class="row2"><button class="main" id="ai-copy"><b>AIへの頼み方をコピー</b></button><button id="ai-stop"><b>取り消し</b></button></div>';
  } else {
    h += '<div class="seg"><button data-s="safe">🔒 を除く</button><button data-s="all">全文</button></div><button class="main" id="ai-new" style="width:100%;text-align:center"><b>番号を発行</b></button>';
  }
  h += '<div class="msg" id="ai-msg"></div>';
  if (log.length) h += '<ul class="log">' + log.slice(0, 5).map(function (e) { return '<li><span>' + hm(e.at) + '・' + (e.scope === "all" ? "全文" : "🔒除く") + '</span><span>' + (AI_END[e.end] || "") + '</span></li>'; }).join("") + '</ul>';
  el.innerHTML = h;
  if (a) {
    var tick = function () {
      var left = Math.max(0, a.exp - Date.now()), s = Math.ceil(left / 1000);
      document.getElementById("ai-left").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      document.getElementById("ai-bar").style.width = (left / 3000) + "%";
      if (!left) aiLoad();
    };
    tick(); AI.t = setInterval(tick, 1000);
    document.getElementById("ai-copy").onclick = function () { copy(aiAsk(a.code), "頼み方"); document.getElementById("ai-msg").textContent = "コピーしました。AIとの会話に貼ってください"; };
    document.getElementById("ai-stop").onclick = function () { aiCall("revoke", {}); };
  } else {
    [].forEach.call(el.querySelectorAll(".seg button"), function (b) {
      b.classList.toggle("on", b.dataset.s === AI.scope);
      b.onclick = function () { AI.scope = b.dataset.s; aiDraw(st); };
    });
    document.getElementById("ai-new").onclick = function () { aiCall("issue", { scope: AI.scope, text: AI.scope === "all" ? MD : strip(MD) }); };
  }
}
function aiCall(action, body) {
  var m = document.getElementById("ai-msg"); if (m) m.textContent = "…";
  if (!window.hbAi) return;
  window.hbAi(action, body).then(function (r) {
    if (r && r.error) { if (m) m.textContent = r.error === "login" ? "ログインを確認してください" : "うまくいきませんでした（" + r.error + "）"; return; }
    aiLoad();
  }, function () { if (m) m.textContent = "通信できませんでした"; });
}
function aiLoad() { if (!window.hbAi || !MD) return aiDraw(null); window.hbAi("status").then(function (st) { aiDraw(st && !st.error ? st : null); }, function () { aiDraw(null); }); }
</script>
<script type="module" src="about-cloud.mjs?v=3"></script>
</body>
</html>
