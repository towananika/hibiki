<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家計 — とわなにか</title>
<script src="../sync.js"></script>
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271; --wood:#93704b; --wood-soft:#ece1d0; --sage:#74886d; --sage-soft:#e2e8dd; --red:#a8553f; --red-soft:#f0dcd5; --blue:#5b7c99; --blue-soft:#dde6ee; --shadow:0 1px 2px rgba(43,41,36,.05),0 16px 40px rgba(43,41,36,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a; --wood:#c99f74; --wood-soft:#382d20; --sage:#9db394; --sage-soft:#26301f; --red:#d98a72; --red-soft:#3a2620; --blue:#8fb0cc; --blue-soft:#222d37; --shadow:none; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.6; font-size:16px; }
  main { max-width:480px; margin:0 auto; padding:24px 16px 64px; }
  a.back { color:var(--wood); font-size:14px; text-decoration:none; }
  h1 { font-size:24px; margin:6px 0 4px; } h2 { font-size:17px; margin:0; }
  .lead { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .sum { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .sum div { border-radius:12px; padding:10px 12px; }
  .sum small { display:block; color:var(--muted); font-size:12px; }
  .sum b { font-size:18px; }
  .in { background:var(--sage-soft); } .out { background:var(--wood-soft); }
  .left { grid-column:1 / 3; background:var(--blue-soft); } .left.neg { background:var(--red-soft); }
  .left.neg b { color:var(--red); }
  .meter { height:10px; border-radius:6px; background:var(--wood-soft); overflow:hidden; margin:12px 0 4px; }
  .meter i { display:block; height:100%; background:var(--sage); } .meter i.over { background:var(--red); }
  .note { color:var(--muted); font-size:12px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  button { white-space:nowrap; font:inherit; cursor:pointer; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:4px 12px; font-size:14px; }
  button.main { background:var(--wood); color:#fff; border-color:var(--wood); }
  button.del { color:var(--red); }
  .row { display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:10px 0; border-top:1px solid var(--border); }
  .row:first-of-type { border-top:0; }
  .name { font-weight:600; word-break:break-word; } .amt { text-align:right; font-variant-numeric:tabular-nums; }
  .amt.zero { color:var(--muted); font-weight:400; font-size:13px; }
  .tag { display:inline-block; white-space:nowrap; font-size:11px; color:var(--blue); background:var(--blue-soft); border-radius:999px; padding:0 8px; margin-left:6px; font-weight:400; }
  .guide { grid-column:1 / 3; font-size:12px; color:var(--muted); }
  .guide.over { color:var(--red); font-weight:600; }
  .share { grid-column:1 / 3; height:6px; background:var(--wood-soft); border-radius:3px; overflow:hidden; }
  .share i { display:block; height:100%; background:var(--wood); }
  .acts { grid-column:1 / 3; display:flex; gap:8px; }
  form.edit { display:grid; gap:8px; margin:8px 0 4px; padding:12px; border-radius:12px; background:var(--wood-soft); }
  form.edit label { font-size:12px; color:var(--muted); display:grid; gap:2px; }
  form.edit input, form.edit select { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); width:100%; }
  .btns { display:flex; gap:8px; justify-content:flex-end; }
  .empty { color:var(--muted); font-size:14px; padding:8px 0; }
  .foot { text-align:center; margin-top:8px; }
  .stack { display:flex; height:14px; border-radius:7px; overflow:hidden; margin-top:12px; background:var(--wood-soft); }
  .stack[hidden] { display:none; }
  .stack i { display:block; height:100%; }
  .s-house { background:var(--wood); } .s-life { background:var(--sage); } .s-care { background:var(--blue); } .s-free { background:var(--border); }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted); margin-top:6px; }
  .legend span::before { content:""; display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  .lg-house::before { background:var(--wood); } .lg-life::before { background:var(--sage); } .lg-care::before { background:var(--blue); } .lg-free::before { background:var(--border); }
  .need h2 { margin-bottom:4px; }
  .need .grp { font-size:12px; color:var(--muted); font-weight:600; margin:14px 0 2px; }
  .need .r { display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:8px 0; border-top:1px solid var(--border); font-size:14px; }
  .need .r .rng { text-align:right; font-variant-numeric:tabular-nums; }
  .need .r small { grid-column:1 / 3; font-size:12px; color:var(--muted); }
  .need .r small b { font-weight:600; }
  .need .r.low small b { color:var(--blue); } .need .r.ok small b { color:var(--sage); } .need .r.high small b { color:var(--red); }
  .memo { grid-column:1 / 3; font-size:13px; color:var(--wood); background:var(--wood-soft); border-radius:8px; padding:6px 10px; }
  form.memo-form { grid-column:1 / 3; display:grid; gap:8px; }
  form.memo-form textarea { font:inherit; font-size:14px; min-height:64px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); width:100%; resize:vertical; }
  .trk { grid-column:1 / 3; position:relative; height:12px; border-radius:6px; background:var(--wood-soft); overflow:hidden; margin-top:4px; }
  .trk .band { position:absolute; top:0; bottom:0; background:var(--sage-soft); outline:1px solid var(--sage); }
  .trk .fill { position:absolute; left:0; top:4px; bottom:4px; border-radius:4px; background:var(--wood); }
  .need .r.low .fill { background:var(--blue); } .need .r.ok .fill { background:var(--sage); } .need .r.high .fill { background:var(--red); }
  .need .tot { display:flex; justify-content:space-between; font-weight:600; border-top:2px solid var(--border); padding-top:10px; margin-top:6px; }
  .row { grid-template-columns:minmax(0,1fr) minmax(100px,140px); align-items:center; }
  .quick-amount, #plan-amount { width:100%; min-width:0; font:inherit; font-variant-numeric:tabular-nums; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px; text-align:right; }
  .plan-input { display:flex; align-items:center; gap:8px; margin:12px 0; }
  #plan-amount { font-size:22px; font-weight:600; }
  #plan-range { width:100%; margin:8px 0; accent-color:var(--blue); }
  .scale { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
  .plan-result { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; padding:12px 0; border-top:1px solid var(--border); }
  .plan-result b { font-size:24px; color:var(--blue); }
  .plan-result[data-negative="true"] b { color:var(--red); }
  .plan-result[data-negative="true"] { color:var(--red); }
  #plan-diff { min-height:20px; margin:4px 0; }
  summary { cursor:pointer; font-size:14px; font-weight:600; padding:16px 0; }
  .head h2 { min-width:0; font-size:16px; }
  .foot { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:24px; }
  input:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← お金と自由</a>
  <h1>家計</h1>
  <p class="lead">1か月のお金 · ウォン（₩）</p>

  <div class="card">
    <div class="sum">
      <div class="in"><small>所得（月）</small><b id="tin">0</b></div>
      <div class="out"><small>費用（月）</small><b id="tout">0</b></div>
      <div class="left" id="left"><small>残る額（月）</small><b id="tleft">0</b></div>
    </div>
    <div class="meter"><i id="mbar" style="width:0%"></i></div>
    <div class="note" id="mnote"></div>
    <div class="stack" id="stack"></div>
    <div class="legend"><span class="lg-house">住まい</span><span class="lg-life">生活費</span><span class="lg-care">保険・つきあい・その他</span><span class="lg-free">残り</span></div>
  </div>

  <section class="card" aria-labelledby="plan-title">
    <div class="head"><h2 id="plan-title">消費の目安を決める</h2><button id="plan-reset" type="button">記録の額に戻す</button></div>
    <label class="note" for="plan-amount">月に使う額（試算）</label>
    <div class="plan-input"><span>₩</span><input id="plan-amount" type="number" min="0" max="1000000000" step="1" inputmode="numeric"></div>
    <input id="plan-range" type="range" min="0" max="1000000" step="10000" aria-label="月に使う額の目安">
    <div class="scale"><span>₩0</span><span id="plan-max"></span></div>
    <div class="stack" id="plan-stack" role="img" aria-label="試算の消費と残り"></div>
    <div class="legend"><span class="lg-life">消費</span><span class="lg-free">残り</span></div>
    <div class="plan-result" id="plan-result" aria-live="polite"><span id="plan-result-label">残る額（月）</span><b id="plan-left">—</b></div>
    <p class="note" id="plan-diff"></p>
    <p class="note" id="plan-rate"></p>
  </section>

  <div class="card need" id="need"></div>

  <div class="card" id="cin"></div>
  <div class="card" id="cout"></div>

  <details>
    <summary>住まい代の上限</summary>
    <div class="card" id="cap">
    <h2>住まい代はいくらまで？</h2>
    <p class="note" style="margin:4px 0 8px">所得から、住まい以外の費用と貯金の目標を引いた残りが上限です。</p>
    <label class="note" for="srate">貯金の目標（所得に対して）</label>
    <select id="srate" style="font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)"><option value="10">10%</option><option value="20">20%</option><option value="30">30%</option></select>
    <div class="sum" style="margin-top:10px"><div class="in" style="grid-column:1/3"><small>住まい代の上限（月）</small><b id="capv">—</b></div></div>
    <div class="note" id="capn"></div>
    </div>
  </details>
  <div class="foot"><button id="cpy">メモをまとめてコピー</button>　<button id="reset">はじめの形にもどす</button></div>
</main>
<script>
(function () {
  var KEY = "hibiki-budget-v1";
  function uid() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function defaults() {
    return {
      income: [{ id: uid(), name: "給料（手取り）", amt: 0 }],
      expense: [
        { id: uid(), name: "住まい（家賃・返済・管理費）", amt: 0, kind: "fixed" },
        { id: uid(), name: "光熱費（電気・ガス・水道）", amt: 0, kind: "var" },
        { id: uid(), name: "通信費（携帯・ネット）", amt: 0, kind: "fixed" },
        { id: uid(), name: "食費", amt: 0, kind: "var" },
        { id: uid(), name: "日用品", amt: 0, kind: "var" },
        { id: uid(), name: "交通費（ガソリン・駐車など）", amt: 0, kind: "var" },
        { id: uid(), name: "保険・医療", amt: 0, kind: "fixed" }
      ]
    };
  }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.income && s.expense) return s; } catch (e) {}
    return defaults();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  var S = load(), editing = null, memoOpen = null; // editing: {type:'income'|'expense', id|null}; memoOpen: 開いているメモの項目id
  var PLAN_KEY = "hibiki-budget-plan-v1", planned = null;
  try {
    var plan = JSON.parse(localStorage.getItem(PLAN_KEY));
    if (plan && Number.isFinite(plan.monthlyExpense) && plan.monthlyExpense >= 0 && plan.monthlyExpense <= 1000000000) planned = plan.monthlyExpense;
  } catch (e) {}
  function savePlan() {
    try { localStorage.setItem(PLAN_KEY, JSON.stringify({ monthlyExpense:planned })); } catch (e) {}
  }
  function renderPlan() {
    var income = sum(S.income), actual = sum(S.expense), amount = planned === null ? actual : planned;
    var max = Math.ceil(Math.max(1000000, income * 1.5, actual, amount) / 10000) * 10000;
    var range = document.getElementById("plan-range"), input = document.getElementById("plan-amount");
    range.max = max; range.value = amount;
    if (document.activeElement !== input) input.value = amount;
    document.getElementById("plan-max").textContent = won(max);
    var remaining = income - amount;
    document.getElementById("plan-result").dataset.negative = String(income > 0 && remaining < 0);
    document.getElementById("plan-result-label").textContent = remaining < 0 && income > 0 ? "足りない額（月）" : "残る額（月）";
    document.getElementById("plan-left").textContent = income > 0 ? won(Math.abs(remaining)) : "—";
    var diff = amount - actual;
    document.getElementById("plan-diff").textContent = (diff === 0 ? "記録の費用と同じ" : "記録の費用より " + won(Math.abs(diff)) + (diff > 0 ? " 多い" : " 少ない"));
    document.getElementById("plan-rate").textContent = income > 0 ? "所得の " + Math.round(amount / income * 100) + "% を消費 · 残りは貯蓄・投資など" : "所得：未入力";
    var chart = document.getElementById("plan-stack"); chart.textContent = "";
    chart.setAttribute("aria-label", income > 0 ? "消費 " + won(amount) + "、" + (remaining < 0 ? "不足 " : "残り ") + won(Math.abs(remaining)) : "所得：未入力");
    if (income > 0) {
      var spent = el("i", "s-life"); spent.style.width = Math.min(100, amount / income * 100) + "%";
      if (remaining < 0) spent.style.background = "var(--red)";
      var rest = el("i", "s-free"); rest.style.width = Math.max(0, remaining / income * 100) + "%";
      chart.appendChild(spent); chart.appendChild(rest);
    }
  }
  function won(n) { return "₩" + Math.round(n).toLocaleString("ja-JP"); }
  function man(n) { return n >= 10000 ? "（約" + (Math.round(n / 1000) / 10).toLocaleString("ja-JP") + "万ウォン）" : ""; }
  var GUIDE = [["住", 20, 30], ["光熱", 3, 6], ["通信", 2, 4], ["食", 15, 20], ["日用", 2, 4], ["交通", 3, 8], ["保険", 3, 8]];
  function guideOf(name) { return GUIDE.find(function (g) { return name.indexOf(g[0]) === 0 || (g[0].length > 1 && name.indexOf(g[0]) >= 0); }); }
  function sum(a) { return a.reduce(function (t, x) { return t + (+x.amt || 0); }, 0); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function renderCap() {
    var i = sum(S.income), house = 0, other = 0;
    S.expense.forEach(function (x) { if (/住/.test(x.name)) house += (+x.amt || 0); else other += (+x.amt || 0); });
    var sel = document.getElementById("srate"); sel.value = String(S.saveRate || 20);
    var v = document.getElementById("capv"), n = document.getElementById("capn");
    if (!i) { v.textContent = "—"; n.textContent = "所得を入れると出ます。"; return; }
    var cap = i - other - i * (S.saveRate || 20) / 100;
    if (cap <= 0) { v.textContent = "₩0"; n.textContent = "住まい以外の費用と貯金の目標で、所得を使い切っています。費用か目標を見直してください。"; return; }
    v.textContent = won(cap) + man(cap);
    n.textContent = house ? "いまの住まい代は " + won(house) + "（上限の " + Math.round(house / cap * 100) + "%）。" + (house > cap ? "上限より多めです。" : "上限の中です。") : "「住まい」に金額を入れると、上限との比べが出ます。";
  }
  // 普通に暮らすための目安（月・ウォン）。手取り月240万・ソウルの一人暮らしを前提にした見立て。
  // 下限より少ないのは「節約しすぎ」のサイン、上限より多いのは見直しの目安。
  var NEED = [
    { g: "住まい", n: "住まい（家賃・返済・管理費）", lo: 400000, hi: 450000, re: /住/ },
    { g: "生活費", n: "食費（会社の食費支援は別に数える）", lo: 300000, hi: 500000, re: /食/ },
    { g: "生活費", n: "光熱費（電気・ガス・水道）", lo: 50000, hi: 100000, re: /光熱/ },
    { g: "生活費", n: "通信費（携帯・ネット）", lo: 30000, hi: 50000, re: /通信/ },
    { g: "生活費", n: "日用品", lo: 30000, hi: 50000, re: /日用/ },
    { g: "生活費", n: "交通費（スクーター：電気・点検の積立）", lo: 20000, hi: 40000, re: /交通/ },
    { g: "備え・つきあい", n: "保険・医療", lo: 50000, hi: 60000, re: /保険/ },
    { g: "備え・つきあい", n: "健康・運動・休み・趣味", lo: 50000, hi: 100000, re: /休|趣味|運動|健康/ },
    { g: "備え・つきあい", n: "好きな人たちとのつきあい", lo: 50000, hi: 100000, re: /つきあい|人/ },
    { g: "備え・つきあい", n: "身の回り（服・美容）", lo: 20000, hi: 40000, re: /服|身の回り/ }
  ];
  function curOf(re) { return S.expense.reduce(function (t, x) { return re.test(x.name) ? t + (+x.amt || 0) : t; }, 0); }
  function renderNeed() {
    var box = document.getElementById("need"), lo = 0, hi = 0, groups = {}, order = [];
    box.textContent = "";
    box.appendChild(el("h2", null, "消費の目安（月）"));
    box.appendChild(el("p", "note", "以前の仮置き額。必要額は、会社の支援や暮らしによって変わります。"));
    NEED.forEach(function (x) {
      if (!groups[x.g]) { groups[x.g] = []; order.push(x.g); }
      groups[x.g].push(x); lo += x.lo; hi += x.hi;
    });
    order.forEach(function (g) {
      box.appendChild(el("div", "grp", g));
      groups[g].forEach(function (x) {
        var cur = curOf(x.re), st = !cur ? "" : cur < x.lo ? "low" : cur > x.hi ? "high" : "ok";
        var r = el("div", "r " + st);
        r.appendChild(el("div", "name", x.n));
        r.appendChild(el("div", "rng", won(x.lo) + "〜" + won(x.hi)));
        // 目安の帯（うすい緑）に、いまの額（色の棒）を重ねる。どちらも同じ目盛り
        var max = Math.max(x.hi * 1.4, cur * 1.1), trk = el("div", "trk");
        var band = el("i", "band"); band.style.left = (x.lo / max * 100) + "%"; band.style.width = ((x.hi - x.lo) / max * 100) + "%";
        var fill = el("i", "fill"); fill.style.width = (cur / max * 100) + "%";
        trk.appendChild(band); trk.appendChild(fill); r.appendChild(trk);
        var s = el("small", null, cur ? "いま " + won(cur) + "　" : "いまは未入力　");
        var lab = { low: "参考額より少ない", ok: "参考額の範囲", high: "参考額より多い" }[st];
        if (lab) s.appendChild(el("b", null, lab));
        r.appendChild(s); box.appendChild(r);
      });
    });
    box.appendChild(el("div", "tot", "合計の目安　" + won(lo) + "〜" + won(hi)));
    box.appendChild(el("p", "note", "この額に、貯金（所得の" + (S.saveRate || 20) + "%）を足すと、残りが自由に使えるお金です。食費の目安は、会社の食費支援（月50万ウォン）が別にあるとして置いています。"));
  }
  function renderStack() {
    var box = document.getElementById("stack"), inc = sum(S.income);
    box.textContent = "";
    if (!inc) return;
    var house = 0, life = 0, care = 0;
    S.expense.forEach(function (x) {
      var a = +x.amt || 0;
      if (/住/.test(x.name)) house += a;
      else if (/食|光熱|通信|日用|交通/.test(x.name)) life += a;
      else care += a;
    });
    var free = Math.max(0, inc - house - life - care);
    [["s-house", house], ["s-life", life], ["s-care", care], ["s-free", free]].forEach(function (p) {
      if (!p[1]) return;
      var b = el("i", p[0]); b.style.width = (p[1] / inc * 100) + "%"; box.appendChild(b);
    });
  }
  function renderSummary() {
    renderPlan();
    renderCap();
    renderStack();
    var i = sum(S.income), o = sum(S.expense), l = i - o;
    document.getElementById("tin").textContent = won(i);
    document.getElementById("tout").textContent = won(o);
    document.getElementById("tleft").textContent = (l < 0 ? "−" : "") + won(Math.abs(l));
    document.getElementById("left").className = "left" + (l < 0 ? " neg" : "");
    var pct = i > 0 ? Math.min(100, o / i * 100) : (o > 0 ? 100 : 0);
    var bar = document.getElementById("mbar");
    bar.style.width = pct + "%"; bar.className = o > i ? "over" : "";
    document.getElementById("mnote").textContent = i > 0
      ? "所得のうち " + Math.round(o / i * 100) + "% を使っています" + (l >= 0 ? "。残り " + won(l) + man(l) : "。足りない額 " + won(-l))
      : "所得の金額を入れると、使った割合が出ます";
  }

  function form(type, item) {
    var f = el("form", "edit");
    var n = el("label", null, "名前"); var ni = el("input"); ni.value = item ? item.name : ""; ni.maxLength = 40; ni.required = true; n.appendChild(ni);
    var a = el("label", null, "月の金額（ウォン）"); var ai = el("input"); ai.type = "number"; ai.min = "0"; ai.step = "1"; ai.inputMode = "numeric"; ai.value = item && item.amt ? item.amt : ""; a.appendChild(ai);
    f.appendChild(n); f.appendChild(a);
    var ki = null;
    if (type === "expense") {
      var k = el("label", null, "種類"); ki = el("select");
      [["fixed", "固定費（毎月ほぼ同じ）"], ["var", "変動費（月によって変わる）"]].forEach(function (p) { var o = el("option", null, p[1]); o.value = p[0]; ki.appendChild(o); });
      ki.value = item ? item.kind : "var"; k.appendChild(ki); f.appendChild(k);
    }
    var b = el("div", "btns"); var c = el("button", null, "やめる"); c.type = "button"; var s = el("button", "main", item ? "直す" : "足す"); s.type = "submit";
    b.appendChild(c); b.appendChild(s); f.appendChild(b);
    c.onclick = function () { editing = null; render(); };
    f.onsubmit = function (e) {
      e.preventDefault();
      var name = ni.value.trim(); if (!name) return;
      var amt = Math.max(0, Math.round(+ai.value || 0));
      var list = S[type];
      if (item) { item.name = name; item.amt = amt; if (ki) item.kind = ki.value; }
      else { var x = { id: uid(), name: name, amt: amt }; if (ki) x.kind = ki.value; list.push(x); }
      editing = null; save(); render();
    };
    setTimeout(function () { ni.focus(); }, 0);
    return f;
  }

  // メモ：特殊な事情（引っ越し・家族の用事・病院など）を書いておく。この端末と同期した端末にだけ残る
  function memoForm(it) {
    var f = el("form", "memo-form"), t = el("textarea"); t.value = it.memo || ""; t.maxLength = 300; t.placeholder = "例：この月は引っ越しで費用が増える／通院が月2回ある など";
    var b = el("div", "btns"), c = el("button", null, "閉じる"); c.type = "button"; var s = el("button", "main", "保存"); s.type = "submit";
    c.onclick = function () { memoOpen = null; render(); };
    b.appendChild(c); b.appendChild(s); f.appendChild(t); f.appendChild(b);
    f.onsubmit = function (e) { e.preventDefault(); it.memo = t.value.trim(); memoOpen = null; save(); render(); };
    return f;
  }
  function copyMemos() {
    var lines = [];
    S.expense.concat(S.income).forEach(function (x) { if (x.memo) lines.push(x.name + "：" + x.memo); });
    var txt = lines.length ? lines.join("\n") : "（メモはまだありません）";
    try { navigator.clipboard.writeText(txt); document.getElementById("cpy").textContent = "コピーしました"; } catch (e) { window.prompt("メモをコピーしてください", txt); }
  }

  function section(type, root, title, total) {
    root.textContent = "";
    var h = el("div", "head"); h.appendChild(el("h2", null, title + "　" + won(total)));
    var add = el("button", "main", "＋ 足す"); add.onclick = function () { editing = { type: type, id: null }; render(); };
    h.appendChild(add); root.appendChild(h);
    if (editing && editing.type === type && editing.id === null) root.appendChild(form(type, null));
    var list = S[type].slice().sort(function (a, b) { return (+b.amt || 0) - (+a.amt || 0); });
    if (!list.length) root.appendChild(el("div", "empty", "まだありません。「＋ 足す」で入れます。"));
    list.forEach(function (it) {
      if (editing && editing.type === type && editing.id === it.id) { root.appendChild(form(type, it)); return; }
      var r = el("div", "row");
      var nm = el("div", "name", it.name);
      if (type === "expense") nm.appendChild(el("span", "tag", it.kind === "fixed" ? "固定費" : "変動費"));
      r.appendChild(nm);
      var amount = el("input", "quick-amount");
      amount.type = "number"; amount.min = "0"; amount.max = "1000000000"; amount.step = "1"; amount.inputMode = "numeric"; amount.value = it.amt || 0;
      amount.setAttribute("aria-label", it.name + "（月・ウォン）");
      amount.onchange = function () {
        if (!amount.validity.valid || amount.value === "") { amount.value = it.amt || 0; return; }
        it.amt = Math.round(Number(amount.value)); save(); render();
      };
      r.appendChild(amount);
      if (type === "expense" && total > 0) {
        var share = el("div", "share"), fill = el("i");
        fill.style.width = ((+it.amt || 0) / total * 100) + "%";
        share.setAttribute("role", "img");
        share.setAttribute("aria-label", "費用全体の " + Math.round((+it.amt || 0) / total * 100) + "%");
        share.appendChild(fill); r.appendChild(share);
      }
      var g = type === "expense" ? guideOf(it.name) : null, inc = sum(S.income);
      if (g) {
        var lo = Math.round(inc * g[1] / 100), hi = Math.round(inc * g[2] / 100);
        r.appendChild(el("div", "guide", "参考：手取りの " + g[1] + "〜" + g[2] + "%" + (inc > 0 ? "（" + won(lo) + "〜" + won(hi) + "）" : "")));
      }
      var acts = el("div", "acts");
      var eb = el("button", null, "直す"); eb.onclick = function () { editing = { type: type, id: it.id }; render(); };
      var db = el("button", "del", "消す"); db.onclick = function () {
        if (!confirm("「" + it.name + "」を消しますか？")) return;
        S[type] = S[type].filter(function (x) { return x.id !== it.id; }); save(); render();
      };
      var mb = el("button", null, it.memo ? "メモ（あり）" : "メモ");
      mb.onclick = function () { memoOpen = memoOpen === it.id ? null : it.id; render(); };
      acts.appendChild(eb); acts.appendChild(db); acts.appendChild(mb); r.appendChild(acts);
      if (it.memo && memoOpen !== it.id) r.appendChild(el("div", "memo", it.memo));
      if (memoOpen === it.id) r.appendChild(memoForm(it));
      root.appendChild(r);
    });
  }

  function render() {
    renderSummary();
    renderNeed();
    section("income", document.getElementById("cin"), "所得", sum(S.income));
    section("expense", document.getElementById("cout"), "費用", sum(S.expense));
  }
  function changePlan(value) {
    var n = Number(value);
    if (value === "" || !Number.isFinite(n) || n < 0 || n > 1000000000) return;
    planned = Math.round(n); savePlan(); renderPlan();
  }
  document.getElementById("plan-amount").oninput = function () { changePlan(this.value); };
  document.getElementById("plan-amount").onblur = function () { this.value = planned === null ? sum(S.expense) : planned; };
  document.getElementById("plan-range").oninput = function () { changePlan(this.value); };
  document.getElementById("plan-reset").onclick = function () { planned = null; savePlan(); renderPlan(); };
  document.getElementById("srate").onchange = function () { S.saveRate = +this.value; save(); renderCap(); };
  document.getElementById("cpy").onclick = copyMemos;
  document.getElementById("reset").onclick = function () {
    if (!confirm("入れた内容を消して、はじめの形にもどします。いいですか？")) return;
    S = defaults(); editing = null; planned = null; savePlan(); save(); render();
  };
  // home/index.htmlと同じ暗号化データ（万ウォン）から、未入力の住まい代だけを補う。
  if (window.HibikiSync) HibikiSync.open("home").then(function (H) {
    if (!H) return;
    var marker = "hibiki-budget-home-amount-v1";
    try { if (localStorage.getItem(marker)) return; } catch (e) { return; }
    var houses = S.expense.filter(function (x) { return /住|家賃|管理費|ローン.*利息/.test(x.name); });
    if (houses.length !== 1) return;
    var it = houses[0];
    if (+it.amt > 0) {
      try { localStorage.setItem(marker, "1"); } catch (e) {}
      return;
    }
    if (![H.deposit, H.loanPct, H.rate, H.rent, H.fee].every(function (v) { return Number.isFinite(v) && v >= 0; }) || H.loanPct > 100) return;
    var interest = H.deposit * H.loanPct / 100 * H.rate / 100 / 12 * 10000;
    var rent = H.rent * 10000, fee = H.fee * 10000;
    var total = Math.round(rent + fee + interest);
    if (!Number.isSafeInteger(total) || total <= 0) return;
    it.amt = total;
    var breakdown = "住まいの内訳（月）：家賃 " + won(rent) + " ＋ 管理費 " + won(fee) + " ＋ ローン利息 約" + won(interest) + "。合計 " + won(total) + "（住まいページの登録条件による計算）。";
    it.memo = (it.memo ? it.memo + "\n" : "") + breakdown;
    try {
      localStorage.setItem(KEY, JSON.stringify(S));
      localStorage.setItem(marker, "1");
    } catch (e) {}
    render();
  }).catch(function () { /* 未ログイン・復号失敗時は既存の記録を保つ。 */ });
  // 旧housingデータは保証金と利息の補足メモとして残す。
  if (window.HibikiSync) HibikiSync.open("housing").then(function (D) {
    if (!D) return;
    try { if (localStorage.getItem("hibiki-budget-housing-seeded")) return; localStorage.setItem("hibiki-budget-housing-seeded", "1"); } catch (e) {}
    var it = S.expense.filter(function (x) { return /住/.test(x.name); })[0];
    if (!it || it.memo) return;
    var monthly = Math.round(D.deposit * D.loanRatio * D.rate / 100 / 12);
    it.memo = D.memo + "月の利息は約" + won(monthly) + "（自動計算）。";
    save(); render();
  }).catch(function () { /* 未ログイン時は既存のメモを保つ。 */ });
  // 承認された毎月の費用を、ログイン後に一度だけ取り込む。
  if (window.HibikiSync) HibikiSync.open("budget-additions").then(function (D) {
    if (!D || !Array.isArray(D.items)) return;
    D.items.forEach(function (item) {
      if (!item || typeof item.id !== "string" || typeof item.name !== "string" ||
          !Number.isFinite(item.amt) || item.amt < 0) return;
      var marker = "hibiki-budget-added-" + item.id;
      try {
        if (localStorage.getItem(marker)) return;
        // 端末で編集済みの金額と、同じ学資返済の既存項目を尊重する。
        var exists = S.expense.some(function (x) {
          return x.id === item.id || (item.id === "education-loan-repayment" && /学資|奨学|学費.*返済/.test(x.name));
        });
        if (!exists) {
          S.expense.push({ id:item.id, name:item.name, amt:item.amt, kind:"fixed", memo:typeof item.memo === "string" ? item.memo : "" });
          localStorage.setItem(KEY, JSON.stringify(S));
        }
        localStorage.setItem(marker, "1");
      } catch (e) { /* 保存できなかった場合は、次に開いたときに再試行する。 */ }
    });
    render();
  }).catch(function () { /* 未ログイン時は既存の家計だけを表示する。 */ });
  render();
})();
</script>
</body>
</html>
