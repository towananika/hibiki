<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>とわなにか — お金のこと</title>
<meta name="description" content="今週の金利が高いか安いか、これから上がるか下がるか、今週やることを一目で。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-title" content="とわなにか">
<meta name="theme-color" content="#93704b">
<script src="../sync.js"></script>
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271;
          --wood:#93704b; --wood-soft:#ece1d0; --sage:#74886d; --red:#b5583f; --blue:#5b7a99; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a;
            --wood:#c99f74; --wood-soft:#382d20; --sage:#9db394; --red:#e08b70; --blue:#8fb0cf; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Apple SD Gothic Neo",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:28px 16px 32px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  .brand { color:var(--wood); font-size:14px; letter-spacing:.1em; font-weight:600; }
  .date { color:var(--muted); font-size:13px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:18px; margin-top:14px; }
  .label { color:var(--muted); font-size:13px; margin:0 0 10px; }

  .gauge { position:relative; height:14px; border-radius:999px;
           background:linear-gradient(90deg, var(--blue), var(--sage) 50%, var(--red)); }
  .pin { position:absolute; top:50%; width:28px; height:28px; margin:-14px 0 0 -14px; border-radius:50%;
         background:var(--surface); border:4px solid var(--text); box-shadow:0 2px 6px rgba(0,0,0,.2); }
  .scale { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:8px; }
  .verdict { font-size:34px; font-weight:800; margin:12px 0 0; }
  .verdict small { font-size:15px; font-weight:500; color:var(--muted); margin-left:6px; }

  .rates { display:grid; gap:18px; }
  .r-head { display:flex; align-items:baseline; gap:8px; }
  .r-name { font-size:15px; font-weight:700; }
  .r-kind { font-size:12px; color:var(--muted); }
  .r-now { margin-left:auto; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
  .r-tag { font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--wood-soft); }
  .r-bar { position:relative; height:8px; border-radius:999px; margin:12px 0 6px;
           background:linear-gradient(90deg, var(--blue), var(--sage) 50%, var(--red)); }
  .r-bar .pin { width:20px; height:20px; margin:-10px 0 0 -10px; border-width:3px; }
  .r-bar.has-mark { margin-top:30px; }
  .r-mark { position:absolute; top:-6px; width:2px; height:20px; margin-left:-1px; background:var(--text); opacity:.6; }
  .r-mark span { position:absolute; top:-18px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:11px; color:var(--muted); }
  .r-ends { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .note { font-size:12px; color:var(--muted); margin:14px 0 0; }
  .mix { display:flex; align-items:center; gap:16px; }
  .mix svg { flex:none; width:128px; height:128px; transform:rotate(-90deg); }
  .legend { display:grid; gap:8px; flex:1; }
  .lg { display:flex; align-items:center; gap:8px; font-size:14px; }
  .lg b { margin-left:auto; font-size:17px; font-variant-numeric:tabular-nums; }
  .lg i { width:12px; height:12px; border-radius:3px; flex:none; }
  .lg small { display:block; font-size:11px; color:var(--muted); }
  .trend { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .t { background:var(--bg); border-radius:14px; padding:12px; text-align:center; }
  .t svg { width:56px; height:56px; display:block; margin:0 auto 4px; }
  .t .when { font-size:13px; color:var(--muted); }
  .t .what { font-size:17px; font-weight:700; }
  .up { color:var(--red); } .down { color:var(--blue); } .flat { color:var(--sage); }

  .todo { display:grid; gap:8px; }
  .do { display:flex; align-items:center; gap:12px; font-size:16px; font-weight:600; }
  .do i { flex:none; width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
          background:var(--wood-soft); color:var(--wood); font-style:normal; font-weight:800; }

  nav { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  nav a { display:flex; flex-direction:column; align-items:center; gap:6px; text-decoration:none; color:var(--text);
          background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 6px; font-size:13px; font-weight:600; }
  nav a svg { width:28px; height:28px; stroke:var(--wood); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  nav a.main { background:var(--wood); border-color:var(--wood); color:var(--surface); }
  nav a.main svg { stroke:var(--surface); }
  footer { color:var(--muted); font-size:12px; margin-top:18px; text-align:center; }
  .lock { display:flex; gap:12px; align-items:center; color:var(--muted); font-size:14px; text-decoration:none; }
  .lock svg { width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .fd-big { font-size:30px; font-weight:700; margin:0; font-variant-numeric:tabular-nums; }
  .fd-big small { font-size:14px; color:var(--muted); font-weight:500; margin-left:4px; }
  .fd-bar { height:12px; border-radius:999px; background:var(--border); overflow:hidden; margin:12px 0 6px; }
  .fd-bar i { display:block; height:100%; background:var(--wood); }
  .fd-ends { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
  .fd-seg { display:flex; gap:6px; margin-top:14px; }
  .fd-seg button { flex:1; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:10px; padding:8px 0; font:inherit; font-size:13px; cursor:pointer; }
  .fd-seg button.on { background:var(--wood); border-color:var(--wood); color:#fff; }
</style>
</head>
<body>
<main>
  <div class="top"><a class="brand" href="../" style="text-decoration:none">← とわなにか</a><span class="date" id="date"></span></div>

  <section class="card" id="fd">
    <p class="label">自由の日</p>
    <div id="fdBody"><a class="lock" href="../sync/"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>ログインすると、ひびきの数字で見えます</a></div>
  </section>

  <section class="card">
    <p class="label">いまの金利</p>
    <div class="gauge"><div class="pin" id="pin"></div></div>
    <div class="scale"><span>安い</span><span>ふつう</span><span>高い</span></div>
    <p class="verdict" id="verdict"></p>
  </section>

  <section class="card">
    <p class="label">国ごとの金利（過去20年の最低〜最高）</p>
    <div class="rates" id="rates"></div>
    <p class="note">政策金利（中央銀行が決める金利）。ピンが今の位置です。</p>
  </section>

  <section class="card">
    <p class="label">これから</p>
    <div class="trend" id="trend"></div>
  </section>

  <section class="card">
    <p class="label">おすすめの配分</p>
    <div class="mix"><svg viewBox="0 0 42 42" id="donut"></svg><div class="legend" id="legend"></div></div>
    <p class="note" id="mixnote"></p>
  </section>

  <section class="card">
    <p class="label">あなたがやること</p>
    <div class="todo" id="todo"></div>
  </section>

  <nav>
    <a class="main" href="report.html"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6M9 15h6"/></svg>レポート</a>
    <a href="choices.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2M3 9h18"/></svg>置き場所</a>
    <a href="video.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>しくみ</a>
  </nav>

  <footer>毎週土曜の朝に更新</footer>
</main>

<script>
// ▼ 毎週ここだけ書き換える（level: 0=安い 50=ふつう 100=高い / dir: up, flat, down / rates: 今・20年の最低と最高と年）
var W = {
  date: "2026年10月9日",
  level: 75,
  verdict: "高め",
  near: { when: "1年", dir: "up", what: "少し上がる" },
  far:  { when: "2〜3年", dir: "down", what: "少し下がる" },
  todo: ["バチモクは返さない", "預金は1〜2年の定期", "株は毎月少しずつ"],
  mix: [
    { name: "ウォン預金", sub: "積立・定期・生活費6か月", pct: 55, color: "var(--sage)" },
    { name: "米国株", sub: "S&P500のETF", pct: 40, color: "var(--wood)" },
    { name: "ビットコイン", sub: "なくなってもいい額", pct: 5, color: "var(--red)" }
  ],
  mixNote: "債券の代わりに定期預金で。毎月の積立もこの割合で、年に1回ずれを戻します。",
  rates: [
    { name: "韓国", kind: "基準金利", now: 3.00, low: 0.5, lowY: 2020, high: 5.25, highY: 2008, mark: { at: 2.5, text: "バチモク 2.5%" } },
    { name: "米国", kind: "FF金利", now: 3.88, low: 0.1, lowY: 2021, high: 5.33, highY: 2023 },
    { name: "ユーロ", kind: "預金金利", now: 2.50, low: -0.5, lowY: 2019, high: 4.0, highY: 2023 },
    { name: "日本", kind: "政策金利", now: 1.25, low: -0.1, lowY: 2016, high: 1.25, highY: 2026 }
  ]
};
// ▲
(function () {
  var $ = function (id) { return document.getElementById(id); };
  $("date").textContent = W.date;
  $("pin").style.left = Math.max(4, Math.min(96, W.level)) + "%";
  $("verdict").innerHTML = W.verdict + "<small>" + (W.level >= 60 ? "預ける人に有利" : W.level <= 40 ? "借りる人に有利" : "どちらでもない") + "</small>";
  var pct = function (r, v) { return Math.max(3, Math.min(97, (v - r.low) / (r.high - r.low) * 100)); };
  var f = function (v) { return (v < 0 ? "−" : "") + Math.abs(v).toFixed(2).replace(/0$/, "") + "%"; };
  $("rates").innerHTML = W.rates.map(function (r) {
    var p = (r.now - r.low) / (r.high - r.low) * 100;
    var tag = p >= 65 ? ["高い", "up"] : p <= 35 ? ["低い", "down"] : ["ふつう", "flat"];
    return '<div><div class="r-head"><span class="r-name">' + r.name + '</span><span class="r-kind">' + r.kind + '</span>' +
      '<span class="r-tag ' + tag[1] + '">' + tag[0] + '</span><span class="r-now">' + f(r.now) + '</span></div>' +
      '<div class="r-bar' + (r.mark ? ' has-mark' : '') + '">' + (r.mark ? '<div class="r-mark" style="left:' + pct(r, r.mark.at) + '%"><span>' + r.mark.text + '</span></div>' : '') +
      '<div class="pin" style="left:' + pct(r, r.now) + '%"></div></div>' +
      '<div class="r-ends"><span>最低 ' + f(r.low) + '（' + r.lowY + '）</span><span>最高 ' + f(r.high) + '（' + r.highY + '）</span></div></div>';
  }).join("");
  var off = 0, R = 15.915;
  $("donut").innerHTML = '<circle cx="21" cy="21" r="' + R + '" fill="none" stroke="var(--border)" stroke-width="7"/>' + W.mix.map(function (m) {
    var c = '<circle cx="21" cy="21" r="' + R + '" fill="none" stroke="' + m.color + '" stroke-width="7" stroke-dasharray="' + (m.pct - 0.6) + ' ' + (100 - m.pct + 0.6) + '" stroke-dashoffset="' + (-off) + '"/>';
    off += m.pct; return c;
  }).join("");
  $("legend").innerHTML = W.mix.map(function (m) {
    return '<div class="lg"><i style="background:' + m.color + '"></i><span>' + m.name + '<small>' + m.sub + '</small></span><b>' + m.pct + '%</b></div>';
  }).join("");
  $("mixnote").textContent = W.mixNote;
  var path = { up: "M8 40 L40 12 M24 12 H40 V28", down: "M8 16 L40 44 M24 44 H40 V28", flat: "M8 28 H44 M32 18 L44 28 L32 38" };
  $("trend").innerHTML = [W.near, W.far].map(function (t) {
    return '<div class="t ' + t.dir + '"><svg viewBox="0 0 52 56" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="' + path[t.dir] + '"/></svg>' +
      '<div class="when">' + t.when + '</div><div class="what">' + t.what + '</div></div>';
  }).join("");
  $("todo").innerHTML = W.todo.map(function (s, i) { return '<div class="do"><i>' + (i + 1) + '</i>' + s + '</div>'; }).join("");
})();

// ── 自由の日（中身は private/money.json。ログインした端末だけで読める）
(function () {
  if (!window.HibikiSync) return;
  HibikiSync.open("money").then(function (M) {
    if (!M) return;
    var spend = M.spend || 100, R = 0.05;
    function f(v) { return Math.round(v).toLocaleString(); }
    function draw() {
      var net = M.stocks + M.crypto - M.debt, save = (M.income - spend) * 12, need = spend * 12 * 25, a = net, n = 0;
      while (a < need && n < 60) { a = a * (1 + R) + save; n++; }
      var age = M.age ? "（" + (M.age + n) + "歳ごろ）" : "";
      document.getElementById("fdBody").innerHTML =
        '<p class="fd-big">あと約' + n + '年<small>' + age + '</small></p>' +
        '<div class="fd-bar"><i style="width:' + Math.min(100, net / need * 100) + '%"></i></div>' +
        '<div class="fd-ends"><span>いま ' + f(net) + '万</span><span>目標 ' + (need / 10000).toFixed(1) + '億</span></div>' +
        '<div class="fd-seg">' + [80, 100, 120, 150].map(function (v) { return '<button data-v="' + v + '"' + (v === spend ? ' class="on"' : '') + '>' + v + '万</button>'; }).join("") + '</div>' +
        '<p class="note">月の生活費（休みと趣味もこみ）。残りは全部積立と投資へ、年5%で育つ計算です。目標は年の生活費の25倍。</p>';
    }
    document.getElementById("fdBody").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-v]"); if (b) { spend = +b.dataset.v; draw(); }
    });
    draw();
  });
})();
</script>
</body>
</html>
