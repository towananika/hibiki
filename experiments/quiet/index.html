<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f1e9">
<title>光の余白 | 響</title>
<script src="../../sync.js"></script>
<style>
  :root {
    --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8;
    --text:#2b2924; --muted:#766f61; --sage:#74886d;
  }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#1c1a16; --surface:#242119; --border:#38332a;
      --text:#ede8dd; --muted:#b6ac9c; --sage:#9db394; }
  }
  * { box-sizing:border-box; }
  html { min-height:100%; }
  body {
    margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  .experience {
    --scene-bg:#f7f6ef; --field:rgba(132,161,128,.24);
    --ring:rgba(120,155,123,.32); --heart:#dce8d3; --shadow:#91b297;
    min-height:100vh; min-height:100svh; max-width:480px;
    margin:0 auto; display:flex; flex-direction:column;
    background:var(--surface); position:relative; overflow:hidden;
  }
  .experience[data-mood="bloom"] {
    --scene-bg:#fbf3e5; --field:rgba(234,180,112,.26);
    --ring:rgba(208,159,110,.28); --heart:#fff0c2; --shadow:#e7b778;
  }
  .experience[data-mood="rest"] {
    --scene-bg:#26313d; --field:rgba(155,184,203,.22);
    --ring:rgba(195,210,221,.12); --heart:#e3e9eb; --shadow:#8fa7b9;
  }
  @media (prefers-color-scheme:dark) {
    .experience[data-mood="calm"] {
      --scene-bg:#222c29; --field:rgba(106,154,128,.2);
      --ring:rgba(154,191,162,.21); --heart:#b7d5bd; --shadow:#668d74;
    }
    .experience[data-mood="bloom"] {
      --scene-bg:#332b26; --field:rgba(214,154,101,.2);
      --ring:rgba(209,160,117,.2); --heart:#e7d9b1; --shadow:#b68e66;
    }
  }
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px 0; position:relative; z-index:2;
  }
  .home {
    display:grid; place-items:center; width:48px; height:48px;
    border:1px solid var(--border); border-radius:50%;
    background:var(--surface); color:var(--text); text-decoration:none;
  }
  .home svg { width:22px; height:22px; fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .mark { color:var(--muted); font-size:16px; letter-spacing:.18em; }
  .scene {
    flex:1; position:relative; min-height:370px; margin:0;
    display:grid; place-items:center; overflow:hidden; isolation:isolate;
    background-color:var(--scene-bg); transition:background-color 1.15s ease;
  }
  .scene::before {
    content:""; position:absolute; width:440px; height:440px;
    border-radius:50%; background:radial-gradient(circle,var(--field) 0%,transparent 70%);
    filter:blur(16px); animation:breathe 8s ease-in-out infinite;
  }
  .scene::after {
    content:""; position:absolute; left:12%; right:12%; bottom:13%;
    height:1px; background:linear-gradient(90deg,transparent,var(--ring),transparent);
    opacity:.55;
  }
  .halo {
    position:absolute; left:50%; top:50%;
    width:238px; height:238px; border:1px solid var(--ring);
    border-radius:50%; opacity:.72;
    transform:translate(-50%,-50%) scale(1);
    animation:ring 9s ease-in-out infinite;
  }
  .halo.outer { width:325px; height:325px; opacity:.4; animation-delay:-4.5s; }
  .light {
    position:absolute; left:50%; top:50%; width:158px; height:158px;
    margin-left:-79px; margin-top:-79px; border-radius:50%;
    background:radial-gradient(circle at 35% 27%,#fff 3%,var(--heart) 42%,var(--shadow) 100%);
    box-shadow:0 0 58px var(--field),inset -13px -19px 25px rgba(255,255,255,.15);
    animation:float 7.5s ease-in-out infinite;
    transition:opacity .8s ease,scale 1s ease;
  }
  .sprout {
    position:absolute; top:50%; left:50%;
    width:128px; height:175px;
    transform:translate(-50%,-39%) scale(.92);
    opacity:0; transition:opacity 1.1s ease,transform 1.1s ease;
  }
  .stem { position:absolute; left:62px; bottom:27px; width:5px; height:95px;
    border-radius:6px; background:linear-gradient(#859f75,#718a71);
    transform-origin:bottom; animation:sway 6s ease-in-out infinite; }
  .leaf { position:absolute; width:49px; height:25px;
    background:linear-gradient(125deg,#bfd1a4,#829c73); border-radius:100% 0 100% 0; }
  .leaf.left { left:19px; bottom:83px; transform:rotate(28deg); }
  .leaf.right { left:61px; bottom:105px; transform:rotate(150deg); }
  .bud { position:absolute; left:53px; bottom:120px; width:24px; height:27px;
    border-radius:80% 80% 45% 45%; transform:rotate(-8deg);
    background:radial-gradient(circle at 40% 28%,#fff8df,#e8b47f); }
  .ground { position:absolute; left:20px; bottom:18px; width:88px; height:18px;
    border-radius:50%; background:radial-gradient(ellipse,rgba(148,130,95,.18),transparent 70%); }
  .moon {
    position:absolute; top:50%; left:50%; width:166px; height:166px;
    transform:translate(-50%,-50%) rotate(-14deg);
    fill:#e1e7e2; filter:drop-shadow(0 0 24px rgba(214,231,239,.32));
    opacity:0; transition:opacity 1.1s ease;
    animation:moonfloat 9s ease-in-out infinite;
  }
  .star {
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:#dbe7ef; box-shadow:0 0 16px 3px rgba(211,225,235,.28);
    opacity:0; transition:opacity .9s ease;
  }
  .star.a { left:23%; top:24%; animation:twinkle 4s ease-in-out infinite; }
  .star.b { left:74%; top:31%; width:3px; height:3px; animation:twinkle 5s ease-in-out -2s infinite; }
  .star.c { left:65%; top:69%; width:2px; height:2px; animation:twinkle 7s ease-in-out -4s infinite; }
  [data-mood="bloom"] .light { animation:none; opacity:.24; scale:.78; }
  [data-mood="bloom"] .sprout { opacity:1; transform:translate(-50%,-42%) scale(1); }
  [data-mood="bloom"] .halo { opacity:.24; }
  [data-mood="rest"] .light { animation:none; opacity:0; }
  [data-mood="rest"] .halo { opacity:.13; }
  [data-mood="rest"] .moon { opacity:1; }
  [data-mood="rest"] .star { opacity:.85; }
  .controls {
    padding:14px 20px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    background:var(--surface); position:relative; z-index:2;
  }
  .moods { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .mood {
    min-height:82px; display:flex; flex-direction:column; gap:5px;
    align-items:center; justify-content:center;
    border:1px solid var(--border); border-radius:16px; cursor:pointer;
    background:transparent; color:var(--muted); font:inherit; font-size:13px;
    transition:background-color .2s ease,border-color .2s ease;
  }
  .mood svg { width:26px; height:26px; fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .mood[aria-pressed="true"] {
    background:var(--bg); border:2px solid var(--sage);
    color:var(--text); font-weight:700;
  }
  .motion-control {
    display:flex; align-items:center; justify-content:center;
    gap:8px; margin:10px auto 0; min-height:44px; padding:8px 12px;
    border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:12px; cursor:pointer;
  }
  .motion-control svg { width:16px; height:16px; stroke:currentColor;
    stroke-width:1.8; fill:none; }
  .motion-control:disabled { cursor:default; opacity:.8; }
  .home:focus-visible,.mood:focus-visible,.motion-control:focus-visible {
    outline:3px solid var(--sage); outline-offset:3px;
  }
  .sr-only {
    position:absolute!important; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .still *, .still *::before, .still *::after { animation:none!important; transition:none!important; }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation:none!important; transition:none!important; }
  }
  @media (min-width:481px) { .experience { border-inline:1px solid var(--border); } }
  @keyframes breathe { 0%,100% { transform:scale(.91); opacity:.78; }
    50% { transform:scale(1.12); opacity:1; } }
  @keyframes ring { 0%,100% { transform:translate(-50%,-50%) scale(.97); }
    50% { transform:translate(-50%,-50%) scale(1.055); } }
  @keyframes float { 0%,100% { transform:translateY(0); }
    50% { transform:translateY(-13px); } }
  @keyframes sway { 0%,100% { transform:rotate(-1deg); }
    50% { transform:rotate(3deg); } }
  @keyframes moonfloat { 0%,100% { transform:translate(-50%,-50%) rotate(-14deg); }
    50% { transform:translate(-50%,-53%) rotate(-12deg); } }
  @keyframes twinkle { 0%,100% { filter:brightness(.7); }
    50% { filter:brightness(1.5); } }
</style>
</head>
<body>
<main id="experience" class="experience" data-mood="calm">
  <h1 class="sr-only">響 — 光の余白</h1>
  <header class="topbar">
    <a class="home" href="../../" aria-label="響のホームに戻る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5l-7 7 7 7"/></svg>
    </a>
    <span class="mark" aria-hidden="true">響</span>
  </header>
  <div id="scene" class="scene" role="img" aria-label="淡い緑の光と輪がゆっくり広がり、穏やかな気持ちを表しています。">
    <div class="halo" aria-hidden="true"></div>
    <div class="halo outer" aria-hidden="true"></div>
    <div class="light" aria-hidden="true"></div>
    <div class="sprout" aria-hidden="true">
      <div class="ground"></div><div class="stem"></div>
      <div class="leaf left"></div><div class="leaf right"></div><div class="bud"></div>
    </div>
    <svg class="moon" viewBox="0 0 160 160" aria-hidden="true">
      <path d="M113 16a66 66 0 1 0 31 119A61 61 0 0 1 113 16Z"/>
    </svg>
    <span class="star a" aria-hidden="true"></span>
    <span class="star b" aria-hidden="true"></span>
    <span class="star c" aria-hidden="true"></span>
  </div>
  <section class="controls" aria-label="光の操作">
    <div class="moods" role="group" aria-label="光の表情を選ぶ">
      <button class="mood" type="button" data-mood-button="calm" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>
        <span>穏やか</span>
      </button>
      <button class="mood" type="button" data-mood-button="bloom" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M12 15C7 15 5 12 5 9c5 0 7 2 7 6ZM12 12c0-4 2-6 7-6 0 4-2 6-7 6Z"/></svg>
        <span>ひらく</span>
      </button>
      <button class="mood" type="button" data-mood-button="rest" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 15A8 8 0 0 1 9 5a8 8 0 1 0 10 10Z"/></svg>
        <span>やすむ</span>
      </button>
    </div>
    <button id="motion-control" class="motion-control" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
      <span id="motion-label">動きを止める</span>
    </button>
  </section>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main>
<script>
(function () {
  "use strict";
  var root=document.getElementById("experience");
  var scene=document.getElementById("scene");
  var announcement=document.getElementById("announcement");
  var labels={
    calm:"淡い緑の光と輪がゆっくり広がり、穏やかな気持ちを表しています。",
    bloom:"やわらかな金色の光に照らされて、小さな芽が伸びています。",
    rest:"深い青の空に、月のような光と小さな星が静かに浮かんでいます。"
  };
  var names={calm:"穏やか",bloom:"ひらく",rest:"やすむ"};
  var moodButtons=document.querySelectorAll("[data-mood-button]");
  function changeMood(value) {
    if (!Object.prototype.hasOwnProperty.call(labels,value)) return;
    root.setAttribute("data-mood",value);
    scene.setAttribute("aria-label",labels[value]);
    Array.prototype.forEach.call(moodButtons,function (button) {
      button.setAttribute("aria-pressed",String(button.getAttribute("data-mood-button")===value));
    });
    announcement.textContent=names[value]+"の光を表示しています。";
  }
  Array.prototype.forEach.call(moodButtons,function (button) {
    button.addEventListener("click",function () {
      changeMood(button.getAttribute("data-mood-button"));
    });
  });
  var control=document.getElementById("motion-control");
  var motionLabel=document.getElementById("motion-label");
  var reduced=window.matchMedia?window.matchMedia("(prefers-reduced-motion: reduce)"):null;
  var paused=false;
  function refreshMotion() {
    var systemReduced=!!(reduced&&reduced.matches);
    var stopped=systemReduced||paused;
    root.classList.toggle("still",stopped);
    control.disabled=systemReduced;
    control.setAttribute("aria-pressed",String(stopped));
    motionLabel.textContent=systemReduced?"動きを減らしています":(paused?"動きを再開":"動きを止める");
  }
  control.addEventListener("click",function () {
    if (reduced&&reduced.matches) return;
    paused=!paused; refreshMotion();
  });
  if (reduced) {
    if (reduced.addEventListener) reduced.addEventListener("change",refreshMotion);
    else if (reduced.addListener) reduced.addListener(refreshMotion);
  }
  refreshMotion();
}());
</script>
</body>
</html>
