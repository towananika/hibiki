<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>YouTube Reader | 響</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main>
<a href="https://towananika.github.io/hibiki/">響</a><h1>YouTube Reader</h1>
<form id="form"><label for="url">動画のリンク</label><div class="entry"><input id="url" name="url" type="url" required placeholder="https://www.youtube.com/watch?v=…"><button id="read" type="submit">読み取る</button></div></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="result" hidden><h2 id="title"></h2><p id="meta"></p><a id="source" target="_blank" rel="noopener noreferrer">YouTubeで開く</a><div class="actions"><button id="copy" type="button">チャット用にコピー</button><button id="download" type="button">文章を保存</button></div><ol id="transcript"></ol></section>
<p class="privacy">このPCで取得。AIへの自動送信・閲覧履歴の保存なし。動画・音声の解析は対象外です。</p>
</main></body></html>
