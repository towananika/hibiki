<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instagram Reader | 響</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><div><p class="brand">HIBIKI TOOLS</p><h1>Instagram Reader</h1></div><span class="local">このPCのみ</span></header>
<form id="form"><label for="url">投稿のリンク</label><div class="url-row"><input id="url" type="url" required placeholder="https://www.instagram.com/p/…" autocomplete="off"><button id="read" class="primary" type="submit">読み取る</button></div></form>
<div class="toolbar"><button id="open" type="button">ブラウザで開く</button><button id="retry" type="button">再取得</button><button id="close" type="button">ブラウザ終了</button></div>
<p id="status" role="status">投稿のリンクを入力してください。</p>
<article id="result" hidden><div class="post-head"><div><h2 id="author"></h2><p id="date"></p></div><a id="original" target="_blank" rel="noopener noreferrer">元の投稿 ↗</a></div><p id="notice"></p><div id="media"></div><div class="caption-head"><h2>本文</h2><div class="toolbar"><button id="copy" type="button">コピー</button><button id="chat" type="button">AI相談用</button><button id="save" type="button">保存</button></div></div><p id="caption"></p><p id="missing" hidden></p></article>
<details><summary>取得範囲とプライバシー</summary><p>本人が閲覧できる投稿だけが対象です。制限を回避しません。本文の省略、全スライド・動画・コメントの未取得がある場合があります。</p><p>専用ブラウザのログイン状態はこのPCに保存されます。パスワードをこの画面に入力する必要はありません。投稿の画像は一時的にメモリへ保持し、再取得・ブラウザ終了で破棄します。外部AIへ自動送信しません。</p></details>
<footer>Hibiki / towananika <span>Open source · MIT</span></footer>
</main><script src="/app.js" defer></script></body></html>
