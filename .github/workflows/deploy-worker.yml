# hibiki-sync（Cloudflare Worker）を自動で公開する。
# worker/ が main に入ったら、テストして通れば公開。Actions 画面から手動でも動かせる。
# 必要なもの: リポジトリの Secrets に CLOUDFLARE_API_TOKEN（Cloudflare の「Edit Cloudflare Workers」テンプレートで作ったトークン）。
name: deploy-worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
concurrency: { group: deploy-worker, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: token check
        env: { T: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: '[ -n "$T" ] || { echo "::error::Secrets に CLOUDFLARE_API_TOKEN がありません"; exit 1; }'
      - name: test
        run: node --test worker/*.test.mjs
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: check
        run: curl -fsS https://hibiki-sync.jaykim-can.workers.dev | head -c 300
