<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHARGE SHOP — ひびき</title><style>:root{color-scheme:light dark;--bg:#f5f1e9;--card:#fffaf2;--ink:#302d27;--sub:#766e61;--line:#ddd2c1;--a:#92704c}@media(prefers-color-scheme:dark){:root{--bg:#1c1a16;--card:#29251f;--ink:#f3eee5;--sub:#b7ac9e;--line:#514637;--a:#d1a47b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:650px;margin:auto;padding:18px 15px 70px}h1{font-size:26px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}p{margin:8px 0}.muted{color:var(--sub);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:10px;border:1px solid var(--line);border-radius:12px;text-align:center}.stat b{display:block;font-size:21px}select,button{font:inherit;border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}select{width:100%;margin:5px 0 12px}button{cursor:pointer}button.primary{background:var(--a);color:white;border-color:var(--a);font-weight:700}button:disabled{opacity:.45;cursor:default}.buttons{display:flex;gap:9px;flex-wrap:wrap}.buttons button{flex:1}.bar{height:18px;border-radius:12px;background:var(--line);overflow:hidden;margin:8px 0}.fill{height:100%;background:#76ac7d;transition:width .25s}.phone{width:115px;height:205px;background:#20232a;border-radius:23px;padding:9px;margin:10px auto;box-shadow:0 10px 25px #0002}.screen{height:100%;border-radius:16px;background:linear-gradient(145deg,#23384d,#416c8e);display:flex;flex-direction:column;align-items:center;justify-content:center;color:white}.screen strong{font-size:32px}.note{min-height:24px;font-weight:600}label{display:block;font-weight:600}.shop button{width:100%;text-align:left;margin:5px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:2px 9px;font-size:12px}a{color:var(--a)}</style></head><body><main><a href="../">← ひびき</a><h1>🔋 CHARGE SHOP</h1><p class="muted">スマホを預かって充電・返却。相性、速度、熱、耐久性を管理しよう。</p><div class="stats"><div class="stat">所持金<b id="money"></b></div><div class="stat">完了件数<b id="served"></b></div><div class="stat">評判<b id="rep"></b></div></div><section class="card"><h2>お客さんの依頼</h2><div id="request"></div><div class="phone"><div class="screen"><span id="model"></span><strong id="percent"></strong><span id="charging">待機中</span></div></div><div class="bar"><div id="bar" class="fill"></div></div><p id="condition" class="muted"></p></section><section class="card"><h2>機材を選ぶ</h2><label for="cable">ケーブル</label><select id="cable"></select><label for="adapter">アダプター</label><select id="adapter"></select><p id="compat" class="muted"></p><div class="buttons"><button class="primary" id="start">充電開始</button><button id="stop">充電停止</button><button id="return">返却する</button></div><p id="notice" class="note" role="status"></p></section><section class="card shop"><h2>機材ショップ</h2><p class="muted">購入すると選択肢が増える。機材は使うほど消耗する。</p><div id="shop"></div><button id="repair">🛠️ 機材を修理（₩100）</button></section><section class="card"><h2>遊び方</h2><p class="muted">端子が一致するケーブルを選び、アダプターを接続。充電を開始すると1秒ごとにゲーム内時間が進む。目標残量以上になったら停止して返却。速すぎる充電や満充電後の放置は熱と消耗を増やす。実際の端末の電池情報は使用しないシミュレーションです。</p><button id="reset">セーブを初期化</button></section></main><script>
(function(){'use strict';
const phones=[{name:'iPhone 13',port:'Lightning',max:20},{name:'iPhone 15',port:'USB-C',max:27},{name:'Galaxy S24',port:'USB-C',max:25},{name:'Pixel 8',port:'USB-C',max:27},{name:'旧型Android',port:'Micro-USB',max:10},{name:'iPad mini',port:'USB-C',max:20}];
const cables=[{id:'usb-c',name:'USB-C ケーブル',port:'USB-C',price:0,speed:30},{id:'lightning',name:'Lightning ケーブル',port:'Lightning',price:250,speed:20},{id:'micro',name:'Micro-USB ケーブル',port:'Micro-USB',price:180,speed:10},{id:'premium',name:'高耐久 USB-C ケーブル',port:'USB-C',price:600,speed:60}];
const adapters=[{id:'basic',name:'標準 10W アダプター',watts:10,price:0},{id:'fast',name:'急速 30W アダプター',watts:30,price:500},{id:'pro',name:'高出力 65W アダプター',watts:65,price:1200}];
const key='hibiki-charge-shop-v1';let state;function fresh(){return{money:300,served:0,rep:3,ownedC:['usb-c'],ownedA:['basic'],wear:{},job:null,active:false,heat:0,spent:0}}try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem(key)||'null')||{});state.active=false}catch(e){state=fresh()}
const el=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}},fmt=n=>'₩'+Math.round(n).toLocaleString('ja-JP'),pick=a=>a[Math.floor(Math.random()*a.length)],say=t=>el('notice').textContent=t;
function newJob(){const phone=pick(phones),start=10+Math.floor(Math.random()*36),target=70+Math.floor(Math.random()*26);state.job={phone:phone.name,port:phone.port,max:phone.max,pct:start,target,reward:160+Math.round((target-start)*4),time:0};state.heat=0;state.spent=0;state.active=false;save()}
function fill(){const c=el('cable'),a=el('adapter'),oldC=c.value,oldA=a.value;c.innerHTML='';a.innerHTML='';cables.filter(x=>state.ownedC.includes(x.id)).forEach(x=>c.add(new Option(x.name+' · 耐久 '+Math.round(100-(state.wear[x.id]||0))+'%',x.id)));adapters.filter(x=>state.ownedA.includes(x.id)).forEach(x=>a.add(new Option(x.name+' · 耐久 '+Math.round(100-(state.wear[x.id]||0))+'%',x.id)));if([...c.options].some(x=>x.value===oldC))c.value=oldC;if([...a.options].some(x=>x.value===oldA))a.value=oldA}
function selected(){return[cables.find(x=>x.id===el('cable').value),adapters.find(x=>x.id===el('adapter').value)]}
function render(){fill();const j=state.job;el('money').textContent=fmt(state.money);el('served').textContent=state.served;el('rep').textContent=state.rep.toFixed(1)+'★';el('model').textContent=j.phone;el('percent').textContent=Math.floor(j.pct)+'%';el('bar').style.width=j.pct+'%';el('request').innerHTML='<b>'+j.phone+'</b> <span class="tag">'+j.port+'</span><p>目標：<b>'+j.target+'%</b> 以上 ／ 基本報酬：<b>'+fmt(j.reward)+'</b></p>';el('charging').textContent=state.active?'⚡ 充電中':'待機中';el('condition').textContent='熱 '+Math.round(state.heat)+' / 100 · 経過 '+j.time+'秒 · 電気代 '+fmt(state.spent);const [c,a]=selected(),ok=c.port===j.port&&(state.wear[c.id]||0)<100&&(state.wear[a.id]||0)<100;el('compat').textContent=ok?'✓ 接続可能（最大 '+Math.min(c.speed,a.watts,j.max)+'W）':'⚠ 端子が違う、または機材が故障している';el('start').disabled=!ok||state.active||j.pct>=100;el('stop').disabled=!state.active;el('return').disabled=state.active;el('shop').innerHTML='';cables.concat(adapters).filter(x=>!(x.port?state.ownedC:state.ownedA).includes(x.id)).forEach(x=>{let b=document.createElement('button');b.textContent=x.name+' — '+fmt(x.price);b.disabled=state.money<x.price;b.onclick=()=>{state.money-=x.price;(x.port?state.ownedC:state.ownedA).push(x.id);save();say(x.name+' を購入！');render()};el('shop').append(b)})}
el('cable').onchange=render;el('adapter').onchange=render;el('start').onclick=()=>{state.active=true;say('充電開始！');render()};el('stop').onclick=()=>{state.active=false;save();say('充電を停止しました');render()};el('return').onclick=()=>{const j=state.job,success=j.pct>=j.target;let reward=success?Math.max(0,Math.round(j.reward-state.spent-(state.heat>65?80:0))):0;state.money+=reward;state.served+=success?1:0;state.rep=Math.max(1,Math.min(5,Math.round((state.rep+(success?.12:-.35))*10)/10));say(success?'返却成功！ '+fmt(reward)+' 獲得':'充電不足。報酬なし、評判が下がった');newJob();render()};el('repair').onclick=()=>{if(state.money<100){say('修理費が足りません');return}state.money-=100;state.wear={};save();say('機材を修理しました');render()};el('reset').onclick=()=>{if(confirm('ゲームデータを初期化しますか？')){state=fresh();newJob();say('初期化しました');render()}};
setInterval(()=>{if(!state.active)return;const j=state.job,[c,a]=selected(),w=Math.min(c.speed,a.watts,j.max);j.time++;j.pct=Math.min(100,j.pct+w/35*(j.pct>80?.45:1));state.heat=Math.max(0,Math.min(100,state.heat+(w>20?2.4:.7)+(j.pct>95?1:0)-.5));state.spent+=.55+w*.035;state.wear[c.id]=(state.wear[c.id]||0)+(c.id==='premium'?.07:.17)*(state.heat>70?2:1);state.wear[a.id]=(state.wear[a.id]||0)+.12*(state.heat>70?2:1);if(j.pct>=100||state.heat>=100||(state.wear[c.id]||0)>=100||(state.wear[a.id]||0)>=100){state.active=false;say(state.heat>=100?'過熱で安全停止！':'充電が停止しました。返却できます')}save();render()},1000);
if(!state.job)newJob();render();
})();
</script></body></html>
