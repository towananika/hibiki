<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健康 — とわなにか</title>
<meta name="description" content="ひびきの健康。毎日4つをタップで記録して、1週間を見る。">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<script src="../sync.js"></script>
<meta name="theme-color" content="#74886d">
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271;
          --wood:#93704b; --sage:#74886d; --sage-soft:#e2e8dd; --blue:#5b7a99; --red:#b5583f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a;
            --wood:#c99f74; --sage:#9db394; --sage-soft:#26301f; --blue:#8fb0cf; --red:#e08b70; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Apple SD Gothic Neo",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:28px 16px 32px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  .brand { color:var(--sage); font-size:14px; letter-spacing:.1em; font-weight:600; text-decoration:none; }
  .date { color:var(--muted); font-size:13px; }
  h1 { font-size:28px; margin:16px 0 0; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:18px; margin-top:14px; }
  .label { color:var(--muted); font-size:13px; margin:0 0 12px; display:flex; justify-content:space-between; }
  .label b { color:var(--sage); }

  .today { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .h { position:relative; border:0; font:inherit; color:var(--text); background:var(--bg); border-radius:16px;
       padding:14px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
  .h svg.ring { width:64px; height:64px; transform:rotate(-90deg); }
  .h .bg { stroke:var(--border); } .h .fg { stroke:var(--sage); transition:stroke-dashoffset .3s; }
  .h .ic { position:absolute; top:30px; width:28px; height:28px; stroke:var(--muted); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .h.on { background:var(--sage-soft); } .h.on .ic { stroke:var(--sage); }
  .today .h.wide { grid-column:1 / -1; }
  .h b { font-size:15px; } .h small { font-size:12px; color:var(--muted); }

  .week { display:grid; gap:10px; }
  .wr { display:grid; grid-template-columns:56px repeat(7,1fr); align-items:center; gap:4px; font-size:13px; }
  .wr.head span { text-align:center; font-size:11px; color:var(--muted); }
  .dot { width:20px; height:20px; border-radius:50%; margin:0 auto; background:var(--border); }
  .dot.on { background:var(--sage); }

  .guide { display:grid; gap:10px; }
  .g { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; }
  .g b { font-size:17px; font-variant-numeric:tabular-nums; }
  .note { font-size:12px; color:var(--muted); margin:12px 0 0; }
  footer { color:var(--muted); font-size:12px; margin-top:18px; text-align:center; }

  .walks{display:grid;gap:10px}.walk{border:1px solid var(--border);border-radius:15px;padding:12px;background:var(--bg)}.walk-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.walk-head strong{font-size:14px}.walk-head small{color:var(--muted);font-size:12px}.walk p{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0 8px}.walk svg{display:block;width:100%;height:auto;border-radius:12px;background:var(--sage-soft)}.walk a{display:inline-block;margin-top:9px;color:var(--sage);font-size:13px;font-weight:600;text-decoration:none}.walk-intro{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 12px}.walk-note{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 0 0}

  .wx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.wx-field{display:grid;gap:4px;font-size:12px;color:var(--muted)}.wx-field select{width:100%;padding:11px 7px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}.wx-result{margin-top:12px;padding:13px;border-radius:13px;background:var(--sage-soft);line-height:1.7;font-size:14px}.wx-result b{display:block}.wx-link{display:inline-block;margin-top:10px;color:var(--sage);font-size:13px;font-weight:600}.wx-foot{font-size:11px;color:var(--muted);line-height:1.6;margin:10px 0 0}
</style>
</head>
<body>
<main>
  <div class="top"><a class="brand" href="../">← とわなにか</a><span class="date" id="date"></span></div>
  <h1>健康</h1>

  <section class="card">
    <p class="label"><span>今日（タップで記録）</span><b id="count"></b></p>
    <div class="today" id="today"></div>
  </section>

  <section class="card">
    <p class="label"><span>この1週間</span><b id="wsum"></b></p>
    <div class="week" id="week"></div>
  </section>

  <section class="card">
    <p class="label"><span>ひびきへ</span></p>
    <p style="margin:0;font-size:15px;line-height:1.8">お金がなかったころの「もったいない」は、ひびきを守ってきた大事な感覚です。<br>でも今は、<b>無理して食べるほうが体の損</b>。多い分は先に取り分けて、明日のごはんにしましょう。<br>買う量と作る量を少し減らすのが、いちばんの節約です。</p>
  </section>

  <section class="card">
    <p class="label"><span>目安</span></p>
    <div class="guide">
      <div class="g"><span>睡眠</span><b>7〜9時間</b></div>
      <div class="g"><span>歩く</span><b>1日 7,000歩〜</b></div>
      <div class="g"><span>息が上がる運動</span><b>週150分〜</b></div>
      <div class="g"><span>水</span><b>1日 1.5L前後</b></div>
      <div class="g"><span>食べる量</span><b>おなかの8割で止める</b></div>
    </div>
    <p class="note">睡眠と運動は WHO などの成人向けの目安です。記録はこのスマホの中だけに残ります。</p>
  </section>

  <footer>5つのうち3つできたら、その日は合格</footer>
</main>

<script>


function weatherAdvice(){
 var t=document.getElementById("wx-temp").value,r=document.getElementById("wx-rain").value,w=document.getElementById("wx-wind").value,b=document.getElementById("wx-body").value;
 var title="",msg="";
 if(r==="heavy"||w==="strong"||b==="poor"){title="今日は屋内で休む・軽く動く";msg="無理して外を歩かず、休息や屋内での軽い運動を優先。";}
 else if(r==="light"||w==="breezy"||t==="cold"||t==="hot"||b==="tired"){title="短めの住宅街コース（10〜15分）";msg="雨具・防寒・水分を用意。寒い、濡れる、疲れると感じたらすぐ帰る。";}
 else{title="散歩しやすそう（20〜30分）";msg="01の住宅街コースから始め、気分がよければ02〜03も候補。";}
 document.getElementById("wx-result").innerHTML="<b>"+title+"</b>"+msg;
}
["wx-temp","wx-rain","wx-wind","wx-body"].forEach(function(id){document.getElementById(id).addEventListener("change",weatherAdvice)});weatherAdvice();

// 散歩シリーズ：地図は概念図。実際の経路・距離を示さない。
var WALKS=[
 {n:"01",t:"住宅街を往復",time:"15〜30分",d:"近くの道を7〜15分歩き、同じ道で戻る。",dest:"버드나루로17길 영등포구",x:115,y:48,label:"住宅街"},
 {n:"02",t:"水と緑の方向へ",time:"30〜45分目安",d:"샛강方面へ。時間が来たら途中で折り返してもいい。",dest:"샛강생태공원 서울",x:252,y:52,label:"샛강方面"},
 {n:"03",t:"公園でひと休み",time:"40〜60分目安",d:"당산공원方面へ。ベンチで休む時間も。",dest:"당산공원 영등포구",x:106,y:114,label:"당산공원"},
 {n:"04",t:"漢江を眺める",time:"50〜80分目安",d:"양화한강공원方面へ。広い景色を見たい日に。",dest:"양화한강공원 서울",x:252,y:115,label:"漢江"},
 {n:"05",t:"少し遠くへ",time:"70〜110分以上",d:"선유도공원方面へ。余裕のある休日に。",dest:"선유도공원 서울",x:250,y:26,label:"선유도"}
];
document.getElementById("walks").innerHTML=WALKS.map(function(w){
 var sx=174,sy=78;
 var svg='<svg viewBox="0 0 350 145" role="img" aria-label="出発点から'+w.label+'方面へ向かう概念図。正確な道路経路ではありません"><path d="M15 42H335M15 101H335M72 12V133M174 12V133M280 12V133" stroke="var(--border)" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M'+sx+' '+sy+' L'+w.x+' '+w.y+'" stroke="var(--sage)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="'+sx+'" cy="'+sy+'" r="8" fill="var(--wood)" stroke="var(--surface)" stroke-width="3"/><circle cx="'+w.x+'" cy="'+w.y+'" r="8" fill="var(--sage)" stroke="var(--surface)" stroke-width="3"/><text x="'+sx+'" y="94" font-size="10" fill="var(--text)" text-anchor="middle">出発付近</text><text x="'+w.x+'" y="'+(w.y<50?w.y+22:w.y-13)+'" font-size="11" font-weight="600" fill="var(--text)" text-anchor="middle">'+w.label+'</text></svg>';
 return '<div class="walk"><div class="walk-head"><strong>'+w.n+'｜'+w.t+'</strong><small>'+w.time+'</small></div><p>'+w.d+'</p>'+svg+'<a href="https://map.naver.com/p/search/'+encodeURIComponent(w.dest)+'" target="_blank" rel="noopener noreferrer">NAVER地図で場所を確認 ↗</a></div>';
}).join("");

var HABITS = [
  { k: "sleep", s: "睡眠", name: "よく寝た", sub: "7時間以上", ic: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>' },
  { k: "walk", s: "歩く",  name: "歩いた",   sub: "7,000歩",   ic: '<circle cx="13" cy="4" r="2"/><path d="M10 21l2-6-2-3 2-4 3 3h3M8 12l2-4"/>' },
  { k: "water", s: "水", name: "水を飲んだ", sub: "1.5L",    ic: '<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>' },
  { k: "veg", s: "野菜",   name: "野菜を食べた", sub: "1回以上", ic: '<path d="M5 19c0-8 6-14 15-14-1 9-7 14-15 14zM5 19l7-7"/>' },
  { k: "enough", s: "腹八分", name: "腹八分で止めた", sub: "残しても、包んでもOK", ic: '<path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-1 1-1 1-2M12 7c0-1 1-1 1-2M16 7c0-1 1-1 1-2"/>' }
];
var KEY = "hibiki-health-v1";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
function ymd(dt) { return dt.getFullYear() + "-" + ("0" + (dt.getMonth() + 1)).slice(-2) + "-" + ("0" + dt.getDate()).slice(-2); }
var data = load(), now = new Date(), today = ymd(now);
var C = 2 * Math.PI * 26;
document.getElementById("date").textContent = (now.getMonth() + 1) + "月" + now.getDate() + "日";

function render() {
  var t = data[today] || {};
  var n = HABITS.filter(function (h) { return t[h.k]; }).length;
  document.getElementById("count").textContent = n + " / " + HABITS.length + (n >= 3 ? "　合格" : "");
  document.getElementById("today").innerHTML = HABITS.map(function (h) {
    var on = !!t[h.k];
    return '<button class="h' + (h.k === "enough" ? ' wide' : '') + (on ? ' on' : '') + '" data-k="' + h.k + '" aria-pressed="' + on + '">' +
      '<svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26" fill="none" stroke-width="6"/>' +
      '<circle class="fg" cx="32" cy="32" r="26" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (on ? 0 : C) + '"/></svg>' +
      '<svg class="ic" viewBox="0 0 24 24">' + h.ic + '</svg><b>' + h.name + '</b><small>' + h.sub + '</small></button>';
  }).join("");

  var days = [];
  for (var i = 6; i >= 0; i--) { var d = new Date(now); d.setDate(now.getDate() - i); days.push(d); }
  var wd = "日月火水木金土";
  var html = '<div class="wr head"><span></span>' + days.map(function (d) { return '<span>' + wd[d.getDay()] + '</span>'; }).join("") + '</div>';
  var total = 0;
  html += HABITS.map(function (h) {
    return '<div class="wr"><span>' + h.s + '</span>' + days.map(function (d) {
      var on = (data[ymd(d)] || {})[h.k]; if (on) total++;
      return '<div class="dot' + (on ? ' on' : '') + '"></div>';
    }).join("") + '</div>';
  }).join("");
  document.getElementById("week").innerHTML = html;
  document.getElementById("wsum").textContent = total + " / " + (HABITS.length * 7);
}
document.getElementById("today").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  var t = data[today] || (data[today] = {});
  t[b.dataset.k] = !t[b.dataset.k];
  save(data); render();
});
render();
</script>
</body>
</html>
