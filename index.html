<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>とわなにか</title>
<script src="sync.js"></script>
<script src="priority/pri.js"></script>
<meta name="description" content="ひびきが幸せに成長し、よい人生を送るために。健康・自由・愛の3つを、AIのみんなと育てる場所。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-title" content="とわなにか">
<meta name="theme-color" content="#93704b">
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271;
          --wood:#93704b; --wood-soft:#ece1d0; --sage:#74886d; --sage-soft:#e2e8dd; --red:#b5583f; --red-soft:#f3e2db; --blue:#5b7a99; --blue-soft:#e0e7ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a;
            --wood:#c99f74; --wood-soft:#382d20; --sage:#9db394; --sage-soft:#26301f; --red:#e08b70; --red-soft:#3a2520; --blue:#8fb0cf; --blue-soft:#1f2a35; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Apple SD Gothic Neo",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:40px 16px 32px; }
  h1 { font-size:28px; margin:0; letter-spacing:.06em; }
  .sub { color:var(--muted); font-size:14px; margin:6px 0 4px; line-height:1.7; }
  .grp { color:var(--muted); font-size:13px; font-weight:600; margin:22px 4px 8px; letter-spacing:.05em; }
  .menu { background:var(--surface); border:1px solid var(--border); border-radius:20px; overflow:hidden; }
  .item { display:flex; align-items:center; gap:14px; padding:14px 16px; text-decoration:none; color:var(--text); }
  .item + .item { border-top:1px solid var(--border); }
  .ic { flex:none; width:44px; height:44px; border-radius:14px; display:grid; place-items:center; }
  .ic svg { width:24px; height:24px; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .item .t { flex:1; min-width:0; }
  .item b { font-size:17px; }
  .item .t > span { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .new { font-style:normal; font-size:10px; font-weight:700; color:#fff; background:var(--red); border-radius:999px; padding:2px 7px; margin-left:6px; vertical-align:2px; }
  .chev { color:var(--muted); font-size:20px; }
  .money .ic { background:var(--wood-soft); } .money svg { stroke:var(--wood); }
  .health .ic { background:var(--sage-soft); } .health svg { stroke:var(--sage); }
  .people .ic { background:var(--red-soft); } .people svg { stroke:var(--red); }
  .more .ic { background:var(--blue-soft); } .more svg { stroke:var(--blue); }
  #pri { background:var(--wood); color:#fff; border-radius:20px; padding:16px 18px; text-decoration:none; margin:14px 0 0; }
  #pri small { opacity:.85; font-size:12px; } #pri b { display:block; font-size:20px; margin:2px 0; } #pri span { font-size:13px; opacity:.95; }
  [hidden] { display:none !important; }
  .site-search { margin-top:20px; }
  .site-search label { display:block; font-size:13px; color:var(--muted); margin-bottom:7px; }
  .search-field { display:flex; gap:8px; align-items:center; padding:4px 6px 4px 12px; border:1px solid var(--border); border-radius:13px; background:var(--surface); }
  .search-field:focus-within { outline:2px solid var(--blue); outline-offset:2px; }
  .search-field input { width:100%; min-width:0; min-height:44px; font:inherit; font-size:16px; border:0; outline:0; color:var(--text); background:transparent; }
  .search-field input::-webkit-search-cancel-button { display:none; }
  .search-field button { flex-shrink:0; min-height:44px; border:0; border-radius:9px; padding:0 10px; font:inherit; font-size:13px; cursor:pointer; color:var(--blue); background:var(--blue-soft); }
  .search-field button:focus-visible, .search-result:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  #search-status { font-size:13px; color:var(--muted); line-height:1.7; margin:10px 0; }
  #search-status:empty { display:none; }
  .search-result { display:block; padding:14px; margin-top:8px; border:1px solid var(--border); border-radius:13px; background:var(--surface); color:var(--text); text-decoration:none; overflow-wrap:anywhere; }
  .search-result strong { display:block; font-size:16px; line-height:1.5; }
  .search-result span { display:block; margin-top:5px; font-size:13px; line-height:1.7; color:var(--muted); }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  .weather-card { margin-top:18px; padding:15px 16px; border:1px solid var(--border); border-radius:18px; background:var(--surface); }
  .weather-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .weather-head strong { font-size:15px; }
  .weather-head select { max-width:130px; padding:8px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; font-size:13px; }
  .weather-main { display:flex; align-items:center; gap:12px; margin-top:12px; }
  .weather-icon { font-size:32px; line-height:1; }
  .weather-temp { font-size:30px; font-weight:700; }
  .weather-detail { color:var(--muted); font-size:13px; line-height:1.7; margin-top:7px; }
  .weather-source { color:var(--muted); font-size:11px; margin-top:8px; }
  .intent-panel { margin-top:20px; padding:16px; border:1px solid var(--border); border-radius:20px; background:var(--surface); }
  .intent-panel h2 { margin:0 0 4px; font-size:18px; }
  .intent-hint { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .intent-tabs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .intent-tab { min-height:64px; padding:12px; border-radius:13px; border:1px solid var(--border); background:var(--bg); color:var(--text); text-align:left; font:inherit; font-weight:600; cursor:pointer; }
  .intent-tab[aria-pressed="true"] { border:2px solid var(--sage); background:var(--sage-soft); }
  .intent-tab:focus-visible, .intent-link:focus-visible, #all-toggle:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
  .intent-links { display:grid; gap:8px; margin-top:14px; }
  .intent-link { display:flex; justify-content:space-between; gap:8px; padding:12px 14px; border-radius:12px; background:var(--bg); color:var(--text); text-decoration:none; font-size:15px; }
  .intent-link span { color:var(--muted); }
  .all-toggle { display:block; width:100%; margin:20px 0 4px; padding:13px; border:1px solid var(--border); border-radius:13px; background:var(--surface); color:var(--text); font:inherit; font-weight:600; cursor:pointer; text-align:left; }
  footer { color:var(--muted); font-size:12px; margin-top:24px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>とわなにか</h1>
  <p class="sub">健康・自由・好きな人たち。<br>ひびきのよい人生のために。</p>
  <section class="weather-card" aria-labelledby="weather-title">
    <div class="weather-head"><strong id="weather-title">今日の天気</strong><label><span class="sr-only">天気の地域</span><select id="weather-city" aria-label="天気の地域"><option value="seoul">ソウル</option><option value="tokyo">東京</option><option value="osaka">大阪</option><option value="busan">釜山</option></select></label></div>
    <div id="weather-content" role="status" aria-live="polite"><p class="weather-detail">天気を取得しています…</p></div>
    <div class="weather-source">予報：Open-Meteo · 地域は端末に保存</div>
  </section>
  <section class="intent-panel" aria-labelledby="intent-title">
    <h2 id="intent-title">今日は何をしたい？</h2>
    <p class="intent-hint">目的を選ぶと、必要な入口だけが出てきます。</p>
    <div class="intent-tabs" role="group" aria-label="今日の目的">
      <button type="button" class="intent-tab" data-intent="record" aria-pressed="true">✎ 記録する</button>
      <button type="button" class="intent-tab" data-intent="review" aria-pressed="false">◷ 振り返る</button>
      <button type="button" class="intent-tab" data-intent="think" aria-pressed="false">◇ 考える</button>
      <button type="button" class="intent-tab" data-intent="rest" aria-pressed="false">☾ ひと休み</button>
    </div>
    <nav id="intent-links" class="intent-links" aria-label="目的に合わせたページ"></nav>
  </section>
  <form id="site-search" class="site-search" role="search">
    <label for="site-query">ページ・教材を探す</label>
    <div class="search-field"><input id="site-query" type="search" placeholder="例：睡眠、生活費、仏教" autocomplete="off" aria-controls="search-results"><button id="search-clear" type="button" hidden>消す</button><button type="submit">検索</button></div>
  </form>
  <p id="search-status" role="status" aria-live="polite" aria-atomic="true"></p>
  <div id="search-results" aria-label="検索結果" hidden></div>
  <div id="priority-slot"><a id="pri" href="priority/" style="display:none"></a></div>
  <button id="all-toggle" class="all-toggle" type="button" aria-expanded="false" aria-controls="menu">すべての機能を見る　⌄</button>
  <div id="menu" hidden></div>
  <footer><a href="sync/" id="login" style="color:inherit">ログイン</a></footer>
</main>
<script>
// 天気は公開予報のみ。位置情報を取得せず、選択した都市だけを保存。
(function () {
  var cities = { seoul:[37.5665,126.9780,"Asia/Seoul"], tokyo:[35.6762,139.6503,"Asia/Tokyo"], osaka:[34.6937,135.5023,"Asia/Tokyo"], busan:[35.1796,129.0756,"Asia/Seoul"] };
  var sel = document.getElementById("weather-city"), box = document.getElementById("weather-content");
  try { var saved = localStorage.getItem("hibiki-weather-city-v1"); if (cities[saved]) sel.value = saved; } catch (e) {}
  function desc(code) {
    if (code === 0) return ["☀️","快晴"];
    if (code <= 3) return ["⛅","晴れ・くもり"];
    if (code <= 48) return ["🌫️","霧"];
    if (code <= 67) return ["🌧️","雨"];
    if (code <= 77) return ["❄️","雪"];
    if (code <= 82) return ["🌦️","にわか雨"];
    if (code <= 86) return ["🌨️","にわか雪"];
    if (code >= 95) return ["⛈️","雷雨"];
    return ["☁️","くもり"];
  }
  function loadWeather() {
    var city = sel.value, c = cities[city]; box.textContent = "天気を取得しています…";
    try { localStorage.setItem("hibiki-weather-city-v1", city); } catch (e) {}
    var url = "https://api.open-meteo.com/v1/forecast?latitude="+c[0]+"&longitude="+c[1]+"&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=1&timezone="+encodeURIComponent(c[2]);
    fetch(url).then(function(r){if(!r.ok)throw Error("network");return r.json();}).then(function(d){
      if (sel.value !== city) return;
      if (!d.current || !d.daily || !d.daily.temperature_2m_max) throw Error("data");
      var w=desc(d.current.weather_code), temp=Math.round(d.current.temperature_2m), feel=Math.round(d.current.apparent_temperature), wind=Math.round(d.current.wind_speed_10m);
      var hi=Math.round(d.daily.temperature_2m_max[0]),lo=Math.round(d.daily.temperature_2m_min[0]),rain=d.daily.precipitation_probability_max[0];
      box.textContent="";
      var line=document.createElement("div");line.className="weather-main";
      var icon=document.createElement("span");icon.className="weather-icon";icon.textContent=w[0];
      var degree=document.createElement("span");degree.className="weather-temp";degree.textContent=temp+"℃";
      var label=document.createElement("span");label.textContent=w[1];label.textContent=(rain>=50?"🌂 雨に注意 · ":"")+w[1];line.append(icon,degree,label);
      var detail=document.createElement("div");detail.className="weather-detail";detail.textContent="雨 "+(rain == null?"—":rain+"%")+" · 体感 "+feel+"℃ · 風 "+wind+"km/h · 最高 "+hi+"℃ / 最低 "+lo+"℃";
      box.append(line,detail);
    }).catch(function(){if(sel.value===city)box.textContent="天気を取得できませんでした。地域を選び直すと再試行できます。";});
  }
  sel.addEventListener("change",loadWeather);loadWeather();
})();
// ▼ ページを足すときはここに1行足す。new: 足した日（7日間「NEW」が出る）
var GROUPS = [
  { n: "毎日", pages: [
    { key: "health", name: "健康", note: "毎日4つをタップ", href: "health/", icon: '<path d="M3 12h4l2-5 4 10 2-5h6"/>' },
    { key: "health", name: "睡眠メモ", note: "寝る・起きたを1タップ", href: "sleep/", new: "2026-10-17", icon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>' },
    { key: "people", name: "愛と関係", note: "連絡・ありがとう・大切な人", href: "relations/", icon: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>' } ]},
  { n: "お金と暮らし", pages: [
    { key: "money", name: "お金と自由", note: "金利・配分・週間レポート", href: "money/", icon: '<circle cx="12" cy="12" r="9"/><path d="M9 9l3 4 3-4M9 13h6M9 16h6M12 13v5"/>' },
    { key: "money", name: "円とウォン", note: "100円は何ウォン？しくみと両替", href: "money/yen.html", new: "2026-10-18", icon: '<circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/>' },
    { key: "money", name: "使える制度", note: "未来積立・税が戻る制度・やること", href: "money/support.html", new: "2026-10-18", icon: '<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>' },
    { key: "money", name: "家計", note: "所得と費用・自分で調整", href: "money/budget.html", new: "2026-10-11", icon: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>' },
    { key: "money", name: "預金と投資", note: "持っているお金を入れる", href: "money/assets.html", new: "2026-10-15", icon: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>' },
    { key: "money", name: "乗り物の費用", note: "スクーターの実費と月あたり", href: "money/vehicle.html", new: "2026-10-15", icon: '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-2-8h-3M13 9h4l1 8"/>' },
    { key: "money", name: "住まい", note: "チョンセ・住まい代", href: "home/", icon: '<path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/>' } ]},
  { n: "自分", pages: [
    { key: "more", name: "夢日記", note: "ねがいを1行ずつ足す・かなったら○", href: "dreams/", new: "2026-10-15", icon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>' },
    { key: "more", name: "これまでの道", note: "人生タイムライン", href: "timeline/", new: "2026-10-11", icon: '<path d="M6 3v18"/><circle cx="6" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><path d="M10 7h10M10 17h7"/>' },
    { key: "more", name: "私について", note: "ほかのAIに貼る説明書・全文コピー", href: "about/", new: "2026-10-17", icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' },
    { key: "more", name: "勉強", note: "科目をえらぶ（経済・食文化・金融・マクロ）", href: "study/", new: "2026-10-17", icon: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/>' } ]},
  { n: "道具", pages: [
    { key: "more", name: "道具箱", note: "間合い：計算ツール", href: "../tool/", icon: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>' } ]}
];
// ▲
var INTENTS = {
  record: ["health/", "sleep/", "money/budget.html", "dreams/"],
  review: ["health/", "money/vehicle.html", "money/budget.html", "timeline/"],
  think: ["priority/", "study/", "money/", "about/"],
  rest: ["sleep/", "dreams/", "relations/"]
};
function renderIntent(kind) {
  var pages = GROUPS.reduce(function (all, group) { return all.concat(group.pages); }, []);
  var root = document.getElementById("intent-links"); root.textContent = "";
  INTENTS[kind].forEach(function (href) {
    var p = pages.filter(function (v) { return v.href === href; })[0];
    var a = document.createElement("a"); a.className = "intent-link"; a.href = href;
    a.textContent = p ? p.name : "いま、これを";
    var arrow = document.createElement("span"); arrow.textContent = "›"; a.appendChild(arrow); root.appendChild(a);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".intent-tab"), function (b) {
    b.setAttribute("aria-pressed", String(b.getAttribute("data-intent") === kind));
  });
  try { localStorage.setItem("hibiki-home-intent-v1", kind); } catch (e) {}
}
Array.prototype.forEach.call(document.querySelectorAll(".intent-tab"), function (b) {
  b.addEventListener("click", function () { renderIntent(b.getAttribute("data-intent")); });
});
var initialIntent = "record";
try { var savedIntent = localStorage.getItem("hibiki-home-intent-v1"); if (INTENTS[savedIntent]) initialIntent = savedIntent; } catch (e) {}
renderIntent(initialIntent);
document.getElementById("all-toggle").addEventListener("click", function () {
  var menu = document.getElementById("menu"), expanded = this.getAttribute("aria-expanded") === "true";
  menu.hidden = expanded; this.setAttribute("aria-expanded", String(!expanded));
  this.textContent = expanded ? "すべての機能を見る　⌄" : "すべての機能を閉じる　⌃";
});
// ▲
var NOW = Date.now();
document.getElementById("menu").innerHTML = GROUPS.map(function (g) {
  return '<div class="grp">' + g.n + '</div><div class="menu">' + g.pages.map(function (p) {
    var fresh = p.new && NOW - new Date(p.new).getTime() < 7 * 864e5;
    return '<a class="item ' + p.key + '" href="' + p.href + '"><span class="ic"><svg viewBox="0 0 24 24">' + p.icon + '</svg></span><span class="t"><b>' + p.name + '</b>' + (fresh ? '<em class="new">NEW</em>' : '') + '<span>' + p.note + '</span></span><span class="chev">›</span></a>';
  }).join("") + '</div>';
}).join("");
if (window.HBPRI) { var pr = document.getElementById("pri"), nx = HBPRI.next; pr.style.display = "block"; pr.innerHTML = "<small>いま、これを</small><b>" + nx.t + "</b><span>" + nx.st + "　›　優先の順番を見る</span>"; }
if (window.HibikiSync) HibikiSync.open("priority").then(function (D) {
  if (!D || !D.top || !D.top[0]) return;
  var pr = document.getElementById("pri"); pr.style.display = "block";
  pr.innerHTML = "<small>いま大事なこと</small><b>" + D.top[0].t + "</b><span>" + D.top[0].today + "　›　先にやる3つを見る</span>";
});
if (window.HibikiSync && HibikiSync.on()) document.getElementById("login").textContent = "ログイン中";
</script>
<script src="search/search.js"></script>
</body>
</html>
