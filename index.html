  }

         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Apple SD Gothic Neo",sans-serif; }

  .search-field:focus-within { outline:2px solid var(--blue); outline-offset:2px; }

  .hier{margin-top:22px}.hier h2{font-size:19px;margin:0 0 7px}.hier-hint{font-size:12px;color:var(--muted);margin:0 0 13px}.tier-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tier-tab{border:1px solid var(--border);border-radius:15px;padding:15px 4px;background:var(--surface);color:var(--text);font:inherit;font-weight:700;font-size:16px;cursor:pointer}.tier-tab[aria-selected="true"]{border:2px solid var(--sage);background:var(--sage-soft)}.tier-mid{display:grid;gap:9px;margin-top:12px}.tier-group{border:1px solid var(--border);background:var(--surface);border-radius:15px;overflow:hidden}.tier-group summary{padding:14px 16px;font-size:15px;font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}.tier-group summary::-webkit-details-marker{display:none}.tier-group summary::after{content:"⌄";color:var(--muted)}.tier-group[open] summary::after{content:"⌃"}.tier-leaves{border-top:1px solid var(--border);padding:5px 12px 11px}.tier-leaf{display:block;padding:11px 6px;text-decoration:none;color:var(--text);border-bottom:1px solid var(--border)}.tier-leaf:last-child{border-bottom:0}.tier-leaf b{display:block;font-size:14px}.tier-leaf small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.tier-tab:focus-visible,.tier-group summary:focus-visible,.tier-leaf:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  var leaves=document.createElement("div");leaves.className="tier-leaves";
  group.items.forEach(function(item){
   var a=document.createElement("a");a.className="tier-leaf";a.href=item[2];
   var b=document.createElement("b");b.textContent=item[0];var s=document.createElement("small");s.textContent=item[1];a.appendChild(b);a.appendChild(s);leaves.appendChild(a);
  });details.appendChild(leaves);root.appendChild(details);
 });
 document.querySelectorAll(".tier-tab").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tier===kind));});
 try{localStorage.setItem("hibiki-tier-v1",kind)}catch(e){}
}
document.querySelectorAll(".tier-tab").forEach(function(b){b.addEventListener("click",function(){renderTree(b.dataset.tier)})});
var initialTier="health";try{var st=localStorage.getItem("hibiki-tier-v1");if(TREE[st])initialTier=st}catch(e){}
renderTree(initialTier);

    { key: "health", name: "睡眠メモ", note: "寝る・起きたを1タップ", href: "sleep/", new: "2026-10-17", icon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>' },
