<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>愛と関係 — とわなにか</title>
<meta name="description" content="好きな人と、愛のあるいい関係でいるために。毎日の小さなことと、大切な人との距離。">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#b5583f">
<style>
  :root { --bg:#f5f1e9; --surface:#fbf9f4; --border:#e2dac8; --text:#2b2924; --muted:#8a8271;
          --wood:#93704b; --sage:#b5583f; --sage-soft:#f3e2db; --blue:#5b7a99; --red:#b5583f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1a16; --surface:#242119; --border:#38332a; --text:#ede8dd; --muted:#a89e8a;
            --wood:#c99f74; --sage:#e08b70; --sage-soft:#3a2520; --blue:#8fb0cf; --red:#e08b70; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Apple SD Gothic Neo",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:28px 16px 32px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  .brand { color:var(--sage); font-size:14px; letter-spacing:.1em; font-weight:600; text-decoration:none; }
  .date { color:var(--muted); font-size:13px; }
  h1 { font-size:28px; margin:16px 0 0; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:18px; margin-top:14px; }
  .label { color:var(--muted); font-size:13px; margin:0 0 12px; display:flex; justify-content:space-between; }
  .label b { color:var(--sage); }

  .today { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .h { position:relative; border:0; font:inherit; color:var(--text); background:var(--bg); border-radius:16px;
       padding:14px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
  .h svg.ring { width:64px; height:64px; transform:rotate(-90deg); }
  .h .bg { stroke:var(--border); } .h .fg { stroke:var(--sage); transition:stroke-dashoffset .3s; }
  .h .ic { position:absolute; top:30px; width:28px; height:28px; stroke:var(--muted); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .h.on { background:var(--sage-soft); } .h.on .ic { stroke:var(--sage); }
  .today .h.wide { grid-column:1 / -1; }
  .h b { font-size:15px; } .h small { font-size:12px; color:var(--muted); }

  .week { display:grid; gap:10px; }
  .wr { display:grid; grid-template-columns:56px repeat(7,1fr); align-items:center; gap:4px; font-size:13px; }
  .wr.head span { text-align:center; font-size:11px; color:var(--muted); }
  .dot { width:20px; height:20px; border-radius:50%; margin:0 auto; background:var(--border); }
  .dot.on { background:var(--sage); }

  .guide { display:grid; gap:10px; }
  .g { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; }
  .g b { font-size:17px; font-variant-numeric:tabular-nums; }
  .people { display:grid; gap:8px; }
  .p { display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:14px; padding:10px 12px; }
  .p b { font-size:15px; } .p small { display:block; font-size:12px; color:var(--muted); }
  .p .gap { margin-left:auto; text-align:right; font-variant-numeric:tabular-nums; }
  .p .gap.far { color:var(--sage); font-weight:700; }
  .p button, .add button { font:inherit; font-size:13px; border:0; border-radius:999px; padding:6px 12px; background:var(--sage); color:var(--surface); cursor:pointer; }
  .p .x { background:transparent; color:var(--muted); padding:6px; }
  .add { display:flex; gap:8px; margin-top:10px; }
  .add input { flex:1; min-width:0; font:inherit; font-size:15px; padding:8px 12px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  .note { font-size:12px; color:var(--muted); margin:12px 0 0; }
  footer { color:var(--muted); font-size:12px; margin-top:18px; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="top"><a class="brand" href="../">← とわなにか</a><span class="date" id="date"></span></div>
  <h1>愛と関係</h1>

  <section class="card">
    <p class="label"><span>今日（タップで記録）</span><b id="count"></b></p>
    <div class="today" id="today"></div>
  </section>

  <section class="card">
    <p class="label"><span>この1週間</span><b id="wsum"></b></p>
    <div class="week" id="week"></div>
  </section>

  <section class="card">
    <p class="label"><span>大切な人</span><b>話してからの日数</b></p>
    <div class="people" id="people"></div>
    <form class="add" id="add"><input id="who" placeholder="名前を足す（例：こさき、母）" maxlength="12"><button>足す</button></form>
    <p class="note">「話した」を押すと0日に戻ります。14日を超えると色が変わります。</p>
  </section>

  <section class="card">
    <p class="label"><span>ひびきへ</span></p>
    <p style="margin:0;font-size:15px;line-height:1.8">いい関係は、大きなことより<b>小さなことの回数</b>でできています。<br>ひとこと連絡する、ありがとうを言う。それで十分です。<br>そして、自分にやさしくすることも、関係のひとつです。</p>
  </section>

  <footer>4つのうち2つできたら、その日は合格</footer>
</main>

<script>
var HABITS = [
  { k: "touch", s: "連絡", name: "連絡した", sub: "好きな人にひとこと", ic: '<path d="M4 5h16v11H8l-4 4z"/>' },
  { k: "time",  s: "一緒", name: "一緒にいた", sub: "電話でもOK", ic: '<circle cx="9" cy="9" r="3"/><circle cx="16" cy="10" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 15c3 0 6 2 6 5"/>' },
  { k: "thanks", s: "感謝", name: "ありがとうを言った", sub: "声でも文字でも", ic: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>' },
  { k: "self",  s: "自分", name: "自分にやさしくした", sub: "休む、好きなことをする", ic: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>' }
];
var KEY = "hibiki-love-v1";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
function ymd(dt) { return dt.getFullYear() + "-" + ("0" + (dt.getMonth() + 1)).slice(-2) + "-" + ("0" + dt.getDate()).slice(-2); }
var data = load(), now = new Date(), today = ymd(now);
var C = 2 * Math.PI * 26;
document.getElementById("date").textContent = (now.getMonth() + 1) + "月" + now.getDate() + "日";

function render() {
  var t = data[today] || {};
  var n = HABITS.filter(function (h) { return t[h.k]; }).length;
  document.getElementById("count").textContent = n + " / " + HABITS.length + (n >= 2 ? "　合格" : "");
  document.getElementById("today").innerHTML = HABITS.map(function (h) {
    var on = !!t[h.k];
    return '<button class="h' + (false ? ' wide' : '') + (on ? ' on' : '') + '" data-k="' + h.k + '" aria-pressed="' + on + '">' +
      '<svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26" fill="none" stroke-width="6"/>' +
      '<circle class="fg" cx="32" cy="32" r="26" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (on ? 0 : C) + '"/></svg>' +
      '<svg class="ic" viewBox="0 0 24 24">' + h.ic + '</svg><b>' + h.name + '</b><small>' + h.sub + '</small></button>';
  }).join("");

  var days = [];
  for (var i = 6; i >= 0; i--) { var d = new Date(now); d.setDate(now.getDate() - i); days.push(d); }
  var wd = "日月火水木金土";
  var html = '<div class="wr head"><span></span>' + days.map(function (d) { return '<span>' + wd[d.getDay()] + '</span>'; }).join("") + '</div>';
  var total = 0;
  html += HABITS.map(function (h) {
    return '<div class="wr"><span>' + h.s + '</span>' + days.map(function (d) {
      var on = (data[ymd(d)] || {})[h.k]; if (on) total++;
      return '<div class="dot' + (on ? ' on' : '') + '"></div>';
    }).join("") + '</div>';
  }).join("");
  document.getElementById("week").innerHTML = html;
  document.getElementById("wsum").textContent = total + " / " + (HABITS.length * 7);
}
document.getElementById("today").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  var t = data[today] || (data[today] = {});
  t[b.dataset.k] = !t[b.dataset.k];
  save(data); render();
});
render();
var PKEY = "hibiki-people-v1";
function pload() { try { return JSON.parse(localStorage.getItem(PKEY)) || []; } catch (e) { return []; } }
function psave(d) { try { localStorage.setItem(PKEY, JSON.stringify(d)); } catch (e) {} }
var people = pload();
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function prender() {
  var el = document.getElementById("people");
  if (!people.length) { el.innerHTML = '<p class="note" style="margin:0">まだいません。下から足してください。</p>'; return; }
  el.innerHTML = people.map(function (p, i) {
    var d = p.last ? Math.floor((new Date(today) - new Date(p.last)) / 86400000) : null;
    return '<div class="p"><button class="x" data-del="' + i + '" aria-label="消す">×</button><div><b>' + esc(p.name) + '</b><small>' + (p.last ? "最後：" + p.last.slice(5).replace("-", "/") : "まだ記録なし") + '</small></div>' +
      '<div class="gap' + (d === null || d > 14 ? ' far' : '') + '">' + (d === null ? "−" : d + "日") + '</div><button data-talk="' + i + '">話した</button></div>';
  }).join("");
}
document.getElementById("people").addEventListener("click", function (e) {
  var t = e.target.closest("button"); if (!t) return;
  if (t.dataset.talk) { people[+t.dataset.talk].last = today; }
  else if (t.dataset.del && confirm("消しますか？")) { people.splice(+t.dataset.del, 1); }
  psave(people); prender();
});
document.getElementById("add").addEventListener("submit", function (e) {
  e.preventDefault(); var v = document.getElementById("who").value.trim(); if (!v) return;
  people.push({ name: v, last: null }); document.getElementById("who").value = ""; psave(people); prender();
});
prender();
</script>
</body>
</html>
